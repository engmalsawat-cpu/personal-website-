<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مهامي — معاينة تفاعلية</title>
<meta name="theme-color" content="#f4f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#D66A1A;--accentText:#A84C07;--accentMark:#C25E14;--accentSoft:#FFF1E6;--accentSoft2:#FDE8D6;--stepRing:rgba(214,106,26,.35);
  --heading:#050810;--text:#0B0B0B;--textStrong:rgb(41,44,53);--textSecondary:#565B65;--textMuted:#828896;--textMeta:#686E7C;
  --metaMuted:rgb(147,152,163);--fieldLabel:#ACB0B9;--ghost:#C7CAD1;
  --page:#FAF9F7;--surface:#FFFFFF;--surface2:#F7F6F4;--field:#F5F4F2;--field2:#F8F7F5;--divider:#F1F0EE;--dividerDark:#ECEAE7;--checkRing:#E7E5E2;
  --danger:#9E1A68;--dangerSoft:#F7EBF3;--accentTag:#B0500A;--veil:rgba(20,16,12,.30);
  --cardShadow:0 1px 2px rgba(20,16,12,.05);--popShadow:0 24px 60px rgba(20,16,12,.24);--detailShadow:0 28px 70px rgba(20,16,12,.28);
  --sticky-yellow:#fdf6de;--sticky-pink:#fde8eb;--sticky-blue:#e4f0fd;--sticky-green:#e8f3f7;--sticky-purple:#f7ede4;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{background:var(--page)}
html,body{margin:0;min-height:100%}
body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased;min-width:320px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}
.num{font-family:Inter,sans-serif}
:where(button,input,textarea,[tabindex]):focus-visible{outline:2px solid #292c35;outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline-width:1.5px;outline-offset:0;border-radius:4px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghostbtn{border:0;background:transparent;padding:0;display:inline-flex;align-items:center}
.thin{scrollbar-width:thin;scrollbar-color:var(--ghost) transparent}
.thin::-webkit-scrollbar{width:6px;height:6px}.thin::-webkit-scrollbar-thumb{background:var(--ghost);border-radius:6px}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100dvh}
.side{position:sticky;top:0;z-index:20;height:100dvh;width:224px;flex-shrink:0;display:flex;flex-direction:column;gap:18px;overflow:hidden;background:var(--surface);padding:16px 12px 0;border-inline-end:1px solid var(--divider);view-transition-name:side}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--heading);color:#fff;display:flex;align-items:center;justify-content:center;font:700 13px Inter,sans-serif}
.brand b{font-size:14px;color:var(--heading);letter-spacing:-.4px}
.qmark{margin-inline-start:auto;width:28px;height:28px;border-radius:100px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--divider);color:var(--textMuted);font:600 13px Inter,sans-serif}
.qmark:hover{background:rgba(0,0,0,.05)}
.creates{display:flex;gap:6px;margin-top:10px}
.creates button{height:34px;flex:1;border:0;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;padding:0 8px}
.btn-task{background:var(--heading);color:#fff}
.btn-task kbd{font:600 12px/16px Inter,sans-serif;background:rgba(255,255,255,.18);border-radius:4px;padding:0 5px}
.btn-note{background:var(--field);color:var(--heading)}
.btn-note:hover{background:var(--dividerDark)}
.navlbl{padding:4px 8px;font-size:11px;font-weight:600;color:var(--fieldLabel)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;display:flex;align-items:center;gap:10px;border-radius:8px;padding:9px 10px;font-size:13px;font-weight:500;color:var(--textMuted);text-align:start;transition:background-color .15s,color .15s}
.nav button:hover{background:var(--field2)}
.nav button[aria-current=page]{background:var(--accentSoft2);color:var(--accentText)}
.nav .cnt{margin-inline-start:auto;font:12px Inter,sans-serif}
.sidescroll{margin:0 -12px;padding:12px 12px 16px;border-top:1px solid var(--divider);flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.sechead{display:flex;align-items:center;gap:6px;padding:4px 8px}
.sechead .t{font-size:11px;font-weight:600;color:var(--fieldLabel)}
.sechead .c{font:11px Inter,sans-serif;color:var(--ghost)}
.plusdot{margin-inline-start:auto;width:18px;height:18px;border-radius:100px;border:0;background:var(--accentSoft);color:var(--accentText);display:flex;align-items:center;justify-content:center;padding:0}
.linkbtn{border:0;background:transparent;font-size:11px;font-weight:500;color:var(--accentText);padding:0}
.schip{width:100%;border:0;display:flex;align-items:flex-start;gap:8px;border-radius:8px;padding:8px 9px;text-align:start;box-shadow:inset 0 0 0 1px var(--checkRing);transition:filter .15s}
.schip:hover{filter:brightness(.985)}
.schip .st{font-size:12px;font-weight:600;line-height:16px;color:var(--textStrong)}
.schip .sp{font-size:12px;line-height:16px;color:color-mix(in srgb,var(--textStrong) 70%,transparent)}
.schip svg{opacity:.38;margin-top:1px;color:var(--textStrong)}
.tagrow{width:100%;border:0;background:transparent;display:flex;justify-content:space-between;gap:8px;border-radius:7px;padding:6px 8px;font-size:12px;color:var(--textMuted)}
.tagrow:hover{background:var(--field2)}
.tagrow[aria-pressed=true]{background:var(--accentSoft2);color:var(--accentText)}
.tagrow .c{font:11px Inter,sans-serif;color:var(--ghost)}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-x:hidden}
#view{flex:1;width:100%;view-transition-name:page}
.mhead{display:none;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--divider);padding:12px 16px;view-transition-name:mhead}
.mhead .logo{width:32px;height:32px;border-radius:8px;font-size:12px}
.mhead b{font-size:15px}
.mnav{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:50;margin:0 auto;max-width:22rem;align-items:center;justify-content:space-around;border-radius:16px;border:1px solid var(--divider);background:rgba(255,255,255,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:6px 8px;box-shadow:0 12px 32px rgba(20,16,12,.16);view-transition-name:mnav}
body.has-overlay .mnav{display:none!important}
.mnav .it{border:0;background:transparent;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:6px 10px;color:var(--textMuted);font-size:11px;font-weight:500}
.mnav .it[aria-current=page]{background:var(--accentSoft2);color:var(--accentText)}
.fab{margin-top:-24px;width:48px;height:48px;flex-shrink:0;border:0;border-radius:100px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(214,106,26,.45);transition:transform .15s}
.fab:active{transform:scale(.95)}
.app.is-focus .side,.app.is-focus .mhead,.app.is-focus .mnav{display:none!important}
@media (max-width:767px){
  .side{display:none}.mhead{display:flex}.mnav{display:flex}
  main{padding-bottom:96px}
  .app.is-focus main{padding-bottom:0}
}

/* ---------- Page header shared ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.ph h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.8px;color:var(--heading)}
.ph .meta{margin-inline-start:auto;font-size:12px;color:var(--textMuted)}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;row-gap:10px;gap:8px;margin-bottom:16px}
.search{display:flex;align-items:center;gap:7px;flex:0 1 320px;min-width:180px;color:var(--ghost)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:13px;color:var(--text)}
.filters{margin-inline-start:auto;display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;gap:2px}
.fbtn{border:0;height:30px;padding:0 10px;border-radius:100px;font-size:11.5px;font-weight:500;background:transparent;color:var(--textMuted);transition:background-color .18s,color .18s,padding .18s}
.fbtn:hover{color:var(--textStrong)}
.fbtn[aria-pressed=true]{padding:0 15px;font-weight:600;background:var(--accentSoft);color:var(--accentText)}
.fbtn .o{opacity:.6}
.mini{height:30px;border:0;display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:0 8px;font-size:12px;font-weight:500;background:transparent;color:var(--textMuted)}
.mini.on{background:var(--accentSoft);color:var(--accentText)}
.vbtn{width:28px;height:28px;border:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--fieldLabel)}
.vbtn[aria-pressed=true]{background:var(--field);color:var(--textStrong)}
.menu{position:absolute;top:calc(100% + 4px);inset-inline-end:0;z-index:30;min-width:170px;background:var(--surface);border-radius:10px;box-shadow:0 12px 32px rgba(20,16,12,.16),inset 0 0 0 1px var(--divider);padding:5px;animation:popIn .15s ease both}
.menu button{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:8px;text-align:start;border-radius:7px;padding:7px 10px;font-size:12.5px;color:var(--textSecondary)}
.menu button:hover,.menu button[data-active]{background:var(--accentSoft);color:#b0500a}
.rel{position:relative}

/* ---------- Stage dot ---------- */
.sd{display:inline-block;flex-shrink:0}

/* ---------- Overview ---------- */
.ov{padding:30px;color:var(--text)}
.ov-wrap{max-width:1060px;display:flex;flex-direction:column;gap:18px}
.ov-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ov-head h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.85px;color:var(--textStrong)}
.ov-ctx{font-size:13.5px;color:var(--textSecondary)}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ov-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:100px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--checkRing);font-size:12.5px;color:var(--textSecondary);white-space:nowrap}
.ov-chip:hover{background:var(--field);color:var(--textStrong)}
.ov-chip b{font:600 12.5px Inter,sans-serif;color:var(--textStrong)}
.ov-date{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:4px}
.ov-date .g{font:12.5px Inter,"IBM Plex Sans Arabic",sans-serif;color:var(--textSecondary)}
.ov-date .h{font-size:12px;color:var(--textMuted)}
.ov-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.card{min-width:0;border-radius:16px;background:var(--surface);box-shadow:var(--cardShadow);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.card.span{grid-column:1/-1}
.ctitle{font-size:13.5px;font-weight:600;letter-spacing:-.3px;color:var(--textStrong)}
.chead{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.clink{margin-inline-start:auto;border:0;background:transparent;padding:0;font-size:12px;font-weight:500;color:var(--textSecondary)}
.clink:hover{color:var(--textStrong);text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:100px;background:var(--accentSoft);font-size:12.5px;font-weight:600;color:var(--accentText);white-space:nowrap}
.pill:hover{background:var(--accentSoft2)}
.prog{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--textMuted)}
.prog .bar{width:64px;height:5px;border-radius:100px;background:var(--field);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--textStrong);border-radius:100px;transition:width .4s var(--ease)}
.item{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 8px;margin:0 -8px;border-radius:10px;transition:opacity .17s ease-in .2s,transform .17s ease-in .2s,background-color .15s}
.item:hover{background:var(--field2)}
.item .acts{margin-inline-start:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acts,.item:focus-within .acts{opacity:1}
@media (hover:none){.item .acts{opacity:1}}
.item.leaving{opacity:0;transform:translateY(-4px);pointer-events:none}
.act{flex-shrink:0;height:28px;padding:0 10px;border:0;border-radius:100px;background:transparent;font-size:12px;font-weight:600;color:var(--textSecondary);white-space:nowrap}
.act:hover{background:var(--surface);color:var(--textStrong);box-shadow:inset 0 0 0 1px var(--checkRing)}
.rowtitle{border:0;background:transparent;padding:0;text-align:start;min-width:0;flex:0 1 auto;font-size:13.5px;font-weight:500;color:var(--textStrong)}
.rowtitle:hover{text-decoration:underline;text-decoration-color:var(--ghost);text-underline-offset:3px}
.chk{position:relative;flex-shrink:0;width:28px;height:28px;margin:0 -5px;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center}
.chk .ring{position:absolute;width:18px;height:18px;border-radius:100px;box-shadow:inset 0 0 0 1.5px var(--textMuted)}
.chk:hover .ring{box-shadow:inset 0 0 0 1.6px var(--textSecondary)}
.chk .fill{position:absolute;width:18px;height:18px;border-radius:100px;background:var(--textStrong);opacity:0;transform:scale(.5);transition:opacity .14s ease-out,transform .16s ease-out}
.chk svg{position:relative}
.chk path{stroke-dasharray:14;stroke-dashoffset:14}
.chk[data-done=true] .fill{opacity:1;transform:scale(1)}
.chk[data-done=true] path{animation:draw .18s ease-out .06s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stagechip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:100px;background:var(--field);font-size:12px;color:var(--textSecondary);white-space:nowrap}
.due{flex-shrink:0;white-space:nowrap;font-size:12px;color:var(--textMuted)}
.due.late{font-weight:600;color:var(--danger)}
.ms-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--field2)}
.ms-row:last-child{border-bottom:0}
.ms-day{flex-shrink:0;width:52px;height:46px;border-radius:10px;background:var(--field2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ms-day b{font:600 15px Inter,sans-serif;color:var(--textStrong)}
.ms-day span{font-size:11px;color:var(--textMuted)}
.ms-day.today{background:var(--accentSoft)}
.ms-day.today b,.ms-day.today span{color:var(--accentText)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--field)}
.seg button{height:24px;border:0;border-radius:7px;padding:0 10px;font-size:12px;font-weight:600;background:transparent;color:var(--textMeta)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--heading);box-shadow:var(--cardShadow)}
.tabs{display:flex;gap:14px;border-bottom:1px solid var(--divider)}
.tab{border:0;background:transparent;padding:0 0 8px;margin-bottom:-1px;font-size:12.5px;font-weight:500;color:var(--textMuted);border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab:hover{color:var(--textStrong)}
.tab[aria-selected=true]{color:var(--textStrong);font-weight:600;border-bottom-color:var(--textStrong)}
.tab b{font:600 12px Inter,sans-serif;margin-inline-start:4px}
.since{flex-shrink:0;font-size:12px;color:var(--textMuted);white-space:nowrap}
.bars{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.barrow{display:flex;align-items:center;gap:11px}
.barrow .l{flex-shrink:0;width:84px;font-size:12.5px;color:var(--textSecondary)}
.barrow .tr{flex:1;min-width:0;height:7px;border-radius:100px;background:var(--field);overflow:hidden}
.barrow .tr i{display:block;height:7px;border-radius:100px;transition:width .5s var(--ease)}
.barrow .n{flex-shrink:0;width:22px;text-align:end;font:600 12.5px Inter,sans-serif;color:var(--textStrong)}
.week{flex-direction:row;align-items:center;gap:22px}
.dots{flex-shrink:0;display:flex;gap:10px}
.dotc{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--textMuted)}
.dotc i{width:12px;height:12px;border-radius:100px;background:var(--field);box-shadow:inset 0 0 0 1px var(--dividerDark)}
.dotc i.f{background:var(--textStrong);box-shadow:none}
.dotc i.t{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--textStrong)}
.wchips{margin-inline-start:auto;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto}
.wchip{flex-shrink:0;max-width:220px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:100px;background:var(--field2);font-size:12px;color:var(--textSecondary)}
.wchip s{text-decoration-color:var(--ghost)}
@media (max-width:979.98px){.ov-grid{grid-template-columns:minmax(0,1fr)}.week{flex-direction:column;align-items:stretch;gap:14px}.wchips{margin-inline-start:0;flex-wrap:wrap}}
@media (max-width:979.98px){.hide-narrow{display:none!important}}
@media (max-width:767px){.ov{padding:20px 16px 24px}.card{padding:18px 16px}.ov-date{margin-inline-start:0;align-items:flex-start;order:-1;padding-top:0}}

/* ---------- Tasks board ---------- */
.tasks{padding:18px 20px 20px}
.stepbtns{display:flex;align-items:center;gap:2px}
.stepbtns button{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--textMuted);display:flex;align-items:center;justify-content:center}
.stepbtns button:hover:not(:disabled){background:var(--field);color:var(--textStrong)}
.stepbtns button:disabled{opacity:.35;cursor:default}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scroll-behavior:smooth}
.col{flex:1 0 260px;min-width:260px;max-width:320px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;border-radius:10px}
.colhead{display:flex;align-items:center;gap:7px;padding:0 2px;min-height:28px}
.colhead .nm{font-size:12.5px;font-weight:600;white-space:nowrap}
.colhead .ct{font-size:11px;color:var(--textMuted)}
.colhead .cap{font:12px Inter,sans-serif;color:var(--textMuted)}
.colhead .end{margin-inline-start:auto;display:inline-flex;align-items:center;gap:2px}
.focuslink{height:28px;border:0;background:transparent;display:inline-flex;align-items:center;padding:0 8px;border-radius:8px;font-size:12px;font-weight:600;color:var(--accentText)}
.focuslink:hover{background:var(--accentSoft)}
.colmenu{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--fieldLabel);display:flex;align-items:center;justify-content:center}
.colmenu:hover{background:var(--field);color:var(--textStrong)}
.colbody{display:flex;flex-direction:column;gap:8px;min-height:40px;max-height:calc(100dvh - 300px);overflow-y:auto;scrollbar-width:none;padding:1px}
.colbody::-webkit-scrollbar{display:none}
.tcard{border-radius:8px;background:var(--surface);box-shadow:var(--cardShadow);padding:10px 11px;cursor:pointer;transition:box-shadow .12s ease,opacity .25s ease,transform .25s ease,background-color .12s}
.fresh .tcard,.fresh .mrow,.fresh .fcard,.fresh .nwrap,.fresh .fsticky{animation:rowIn .22s var(--ease) both}
.tcard.new{animation:rowIn .22s var(--ease) both}
.tcard:hover{box-shadow:0 1px 2px rgba(20,16,12,.05),0 0 0 1px var(--dividerDark)}
.tcard.new{box-shadow:0 0 0 1.5px var(--accent),var(--cardShadow)}
.tcard.done{opacity:.55}
.tcard.leaving{opacity:0;transform:translateY(-4px) scale(.98)}
.tc-top{display:flex;align-items:flex-start;gap:8px}
.circ{margin-top:2px;width:15px;height:15px;flex-shrink:0;border:0;padding:0;border-radius:100px;background:transparent;box-shadow:inset 0 0 0 1.4px var(--checkRing);position:relative;transition:background-color .16s,box-shadow .16s,transform .16s}
.circ:hover{box-shadow:inset 0 0 0 1.4px var(--textMuted)}
.circ.on{background:var(--accent);box-shadow:inset 0 0 0 1.4px var(--accent);animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.tc-title{flex:1;min-width:0;font-size:13px;font-weight:500;letter-spacing:-.4px;line-height:18px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration-color:transparent;transition:text-decoration-color .2s}
.tcard.done .tc-title,.tcard.leaving .tc-title{text-decoration:line-through;text-decoration-color:currentColor}
.racts{display:flex;margin:-5px 0 -5px -6px}
.ract{width:28px;height:28px;flex-shrink:0;border:0;padding:0;border-radius:7px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--textMuted);transition:opacity .15s}
.ract:hover{background:var(--field);color:var(--textStrong)}
.ract[data-reveal]{opacity:0}
.tcard:hover .ract[data-reveal],.tcard:focus-within .ract[data-reveal]{opacity:1}
@media (hover:none){.ract[data-reveal]{opacity:1}}
.ract.star-on{color:var(--accentText)}
.tc-desc{margin:5px 23px 0 0;font-size:12px;line-height:17px;color:var(--textSecondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-meta{margin:7px 23px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.datechip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--textMuted)}
.datechip.late{color:var(--danger)}
.odl{font-size:12px;font-weight:600;color:var(--danger);white-space:nowrap}
.frac{font:11.5px Inter,sans-serif;color:var(--metaMuted)}
.tagt{font-size:12px;color:var(--accentTag)}
.waitchip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:100px;background:var(--field);font-size:11.5px;color:var(--textSecondary)}
.composer{display:flex;align-items:center;gap:7px;height:36px;padding:0 10px;border-radius:8px;color:var(--fieldLabel);transition:background-color .15s}
.composer:hover,.composer:focus-within{background:var(--surface);box-shadow:var(--cardShadow)}
.composer input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:12.5px;color:var(--text)}
.composer input::placeholder{color:var(--fieldLabel)}
.composer .exp{border:0;background:transparent;color:var(--fieldLabel);padding:0;display:flex}
.composer .exp:hover{color:var(--textStrong)}
.addcol{flex:0 0 auto;align-self:flex-start;height:30px;border:0;border-radius:8px;background:transparent;color:var(--textMuted);font-size:12px;font-weight:500;padding:0 10px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.addcol:hover{background:var(--field)}
.typing{border-inline-start:1.5px solid var(--accent);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}
/* list view */
.rail{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.railchip{height:28px;border:0;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:100px;font-size:12px;color:var(--textSecondary)}
.lgroup{margin-top:10px}
.lgroup h4{display:flex;align-items:center;gap:7px;margin:0 0 6px;padding:0 4px;font-size:12.5px;font-weight:600}
.lgroup h4 span{font-size:11px;font-weight:400;color:var(--textMuted)}
.lrows{background:var(--surface);border-radius:10px;box-shadow:var(--cardShadow)}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--field2);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--field2)}
.lrow .tc-title{-webkit-line-clamp:1}
/* phone list */
.m-tasks{padding:14px 0 0}
.m-tasks .ph{padding:0 20px}
.fscroll{overflow-x:auto;padding:0 20px 12px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fscroll .in{display:inline-flex;gap:4px}
.fchip{height:34px;border:0;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:100px;background:var(--surface);box-shadow:var(--cardShadow);white-space:nowrap;transition:background-color .18s}
.fchip .l{font-size:13px;color:var(--textStrong)}
.fchip .c{font:12px Inter,sans-serif;color:var(--textMuted)}
.fchip[aria-pressed=true]{background:var(--accentSoft2)}
.fchip[aria-pressed=true] .l{color:var(--heading);font-weight:600}
.fchip[aria-pressed=true] .c{color:var(--textStrong)}
.mlist{padding:2px 20px 24px;display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:stretch;border-radius:12px;background:var(--surface);box-shadow:var(--cardShadow);padding:4px 4px 4px 0;transition:opacity .25s,transform .25s}
.mrow.leaving{opacity:0;transform:translateX(30px)}
.mrow .cb{width:44px;flex-shrink:0;border:0;background:transparent;display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
.mrow .cb i{width:19px;height:19px;border-radius:100px;box-shadow:inset 0 0 0 1.5px var(--checkRing);transition:background-color .16s,box-shadow .16s}
.mrow .cb i.on{background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);animation:pop .22s ease-out}
.mrow .bd{flex:1;min-width:0;padding:9px 0;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.mrow .tt{font-size:15px;font-weight:500;letter-spacing:-.4px;line-height:21px;color:var(--text)}
.mrow.leaving .tt{text-decoration:line-through}
.mrow .mm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;color:var(--textMuted)}
.mrow .ex{width:44px;flex-shrink:0;border:0;background:transparent;color:var(--textMuted);display:flex;align-items:center;justify-content:center}
.empty{padding:40px 10px;text-align:center;color:var(--textMuted);font-size:13px}
.empty b{display:block;color:var(--textStrong);font-weight:600;font-size:14px;margin-bottom:4px}

/* ---------- Detail card ---------- */
.veil{position:fixed;inset:0;z-index:44;overflow-y:auto;background:var(--veil);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:12px;animation:veilIn .16s ease both}
.veil.top{align-items:flex-start;padding-top:96px}
.dcard{width:620px;max-width:100%;max-height:calc(100vh - 24px);overflow-y:auto;flex-shrink:0;border-radius:12px;background:var(--surface);box-shadow:var(--detailShadow);display:flex;flex-direction:column;animation:composerIn .22s var(--ease) both;view-transition-name:none}
.dcard.morph,.ncomp.morph{animation:none}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px 0 14px}
.dhead .ic{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.gb{border:0;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--textMuted);border-radius:6px;min-width:22px;min-height:22px}
.gb:hover{color:var(--textStrong);background:var(--field)}
.gb.on{color:var(--accentText)}
.dbody{display:flex}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;padding:11px 16px 14px;gap:13px}
.dtitle{display:flex;align-items:flex-start;gap:9px}
.dtitle .circ{width:18px;height:18px;margin-top:4px}
.dtitle h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.5px;line-height:26px;color:var(--heading)}
.dcard.isdone .dtitle h3{text-decoration:line-through;color:var(--textMuted)}
.ddesc{background:var(--field2);border-radius:9px;padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:600;color:var(--textMeta)}
.ddesc p{margin:0;font-size:13px;line-height:22px;color:var(--textStrong)}
.steps{display:flex;flex-direction:column;gap:8px}
.steps .h{display:flex;align-items:center;gap:7px}
.steps .h b{font-size:12px;font-weight:700;color:var(--heading)}
.steps .h .n{font:12px Inter,sans-serif;color:var(--textMeta)}
.steps .pb{flex:1;max-width:80px;height:3px;border-radius:100px;background:var(--divider);overflow:hidden}
.steps .pb i{display:block;height:100%;background:var(--accentMark);transition:width .35s var(--ease)}
.step{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:0;text-align:start}
.step i{width:14px;height:14px;flex-shrink:0;border-radius:100px;box-shadow:inset 0 0 0 1.4px var(--checkRing);transition:background-color .15s,box-shadow .15s}
.step.on i{background:var(--accentSoft2);box-shadow:inset 0 0 0 1.4px var(--stepRing);animation:pop .22s ease-out}
.step span{font-size:12.5px;color:var(--textStrong)}
.step.on span{color:var(--textMuted);text-decoration:line-through}
.stepadd{display:flex;align-items:center;gap:9px}
.stepadd input{flex:1;min-width:0;border:0;background:transparent;font-size:12.5px;color:var(--textStrong);padding:2px 4px;margin:-2px -4px}
.subs{display:flex;flex-direction:column;gap:6px}
.subrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--textStrong)}
.subrow .sd{margin:0 4px}
.daside{width:186px;flex-shrink:0;background:var(--surface2);padding:11px 14px 16px;display:flex;flex-direction:column;gap:12px}
.props{display:flex;flex-direction:column;gap:9px}
.prop{display:flex;align-items:center;gap:8px}
.prop.top{align-items:flex-start}
.prop .k{width:56px;flex-shrink:0;font-size:12px;color:var(--textMeta);white-space:nowrap}
.prop .v{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--textStrong);border:0;background:transparent;padding:0}
.prop input{flex:1;min-width:0;border:0;background:transparent;font-size:12px;color:var(--textStrong);padding:2px 4px;margin:-2px -4px;text-overflow:ellipsis}
.pchip{height:20px;padding:0 8px;border:0;border-radius:100px;background:var(--surface);font-size:12px;color:var(--textSecondary);display:inline-flex;align-items:center;white-space:nowrap}
.pchip:hover{color:var(--textStrong);box-shadow:inset 0 0 0 1px var(--checkRing)}
.dacts{margin-top:auto;display:flex;align-items:center;gap:12px;border-top:1px solid var(--dividerDark);padding-top:10px}
.dacts button{border:0;background:transparent;padding:0;font-size:12px;color:var(--textMeta)}
.dacts .p{font-weight:600;color:var(--accentText)}
.stmenu{position:absolute;top:calc(100% + 4px);inset-inline-start:0;z-index:5;min-width:150px}
@media (max-width:640px){.qa .hint{display:none}.veil{align-items:flex-end;padding:0}.veil.top{padding-top:0}.dcard{border-radius:16px 16px 0 0;max-height:88vh}.dbody{flex-direction:column}.daside{width:auto}}

/* ---------- Quick add ---------- */
.qa{width:540px;max-width:calc(100vw - 24px);border-radius:14px;background:var(--surface);box-shadow:var(--popShadow);padding:18px 18px 12px;display:flex;flex-direction:column;gap:10px;animation:composerIn .2s var(--ease) both}
.qa .ti{border:0;outline:none;background:transparent;font-size:17px;font-weight:700;letter-spacing:-.5px;color:var(--heading)}
.qa .ti::placeholder{color:var(--fieldLabel);font-weight:600}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:100px;background:var(--field);font-size:12px;color:var(--textSecondary);animation:popIn .15s ease both}
.pc.tag{color:var(--accentText)}
.saved{display:flex;align-items:center;gap:6px;min-height:28px;font-size:12.5px;color:var(--textMuted);animation:rowIn .2s ease both}
.saved b{color:var(--textStrong);font-weight:600}
.saved button{border:0;background:transparent;padding:0;font-size:12.5px;font-weight:600;color:var(--accentText)}
.qa .foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--divider);padding-top:10px}
.duec{border:0;border-radius:100px;height:28px;padding:0 11px;font-size:12px;font-weight:500;background:var(--field2);color:var(--textMuted)}
.duec[aria-pressed=true]{background:var(--accentSoft);color:var(--accentText)}
.qa .hint{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--textMuted)}
kbd.k{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--dividerDark),0 1px 0 var(--dividerDark);font:12px/1 Inter,sans-serif;color:var(--textSecondary);white-space:nowrap;direction:ltr}

/* ---------- Notes ---------- */
.notes{padding:18px 20px 20px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));grid-auto-rows:1fr;gap:10px;align-content:start}
.nwrap{display:flex;min-width:0}
.ntile{position:relative;flex:1;min-width:0;display:flex;border-radius:10px;background:var(--surface);box-shadow:0 1px 2px rgba(20,16,12,.05),inset 0 0 0 1px #f1f0ee;transition:transform .16s ease-out,box-shadow .16s}
.ntile:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(20,16,12,.05),inset 0 0 0 1px #c7cad1}
.ntile>.open{flex:1;min-width:0;border:0;border-radius:10px;background:transparent;text-align:start;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.nmeta{display:flex;align-items:center;gap:6px;min-height:22px}
.mtag{display:inline-flex;align-items:center;padding:2px 6px;border-radius:5px;background:var(--accentSoft2);font-size:12px;font-weight:600;color:var(--accentText)}
.ndate{margin-inline-start:auto;font:12px Inter,"IBM Plex Sans Arabic",sans-serif;color:var(--textMeta)}
.ntitle{display:block;font-size:13px;font-weight:700;line-height:18px;letter-spacing:-.4px;color:var(--heading)}
.nprev{min-height:36px;font-size:12px;line-height:18px;color:var(--textMeta);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nfoot{margin-top:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
.nfoot .a{margin-inline-start:auto;color:var(--textMeta)}
.pinb{position:absolute;top:8px;inset-inline-end:5px;width:28px;height:28px;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--textMuted)}
.pinb:hover{background:rgba(0,0,0,.04)}
.pinb.on{color:var(--accentText)}
.wallbtn{height:30px;border:0;border-radius:100px;padding:0 12px;font-size:12px;font-weight:600;background:var(--accentSoft2);color:var(--accentText)}
.ncomp{width:640px;max-width:calc(100vw - 24px);min-height:420px;border-radius:14px;background:var(--surface);box-shadow:var(--popShadow);padding:16px 18px 14px;display:flex;flex-direction:column;gap:14px;animation:composerIn .22s var(--ease) both}
.ncomp .kinds{position:relative;display:flex;align-items:center;justify-content:center}
.ncomp .x{position:absolute;inset-inline-end:0;top:0}
.ncomp .tt{border:0;outline:none;background:transparent;font-size:17px;font-weight:700;letter-spacing:-.5px;color:var(--heading)}
.ncomp textarea{flex:1;min-height:200px;resize:none;border:0;outline:none;background:transparent;font-size:13px;line-height:24px;color:var(--text)}
.ncomp .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ncomp .foot .sp{margin-inline-start:auto}
.btn2{height:32px;border:0;border-radius:100px;padding:0 16px;font-size:12.5px;font-weight:600}
.btn2.cancel{background:var(--field);color:var(--textMuted)}
.btn2.save{background:var(--accentSoft);color:var(--accentText)}
.swatch{width:20px;height:20px;border-radius:100px;border:0;box-shadow:inset 0 0 0 1px var(--checkRing)}
.swatch[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--checkRing),0 0 0 2px var(--surface),0 0 0 3.5px var(--textStrong)}

/* ---------- Focus ---------- */
.focus{position:relative;width:100%;min-height:100dvh;display:flex;justify-content:center;padding:40px 26px 72px;background:var(--surface2);color:var(--text)}
.fwrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:32px}
.fexit{margin-inline-start:auto;border:0;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 7px 0 12px;border-radius:100px;background:transparent;box-shadow:inset 0 0 0 1px var(--dividerDark);font-size:13px;font-weight:500;color:var(--textSecondary)}
.fexit:hover,.slink:hover{background:var(--dividerDark);color:var(--heading)}
.fgreet{display:flex;align-items:flex-start;gap:14px}
.fgreet h2{margin:0;font-size:28px;font-weight:600;letter-spacing:-1px;color:var(--textStrong)}
.odtoggle{align-self:flex-start;border:0;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;margin:0 -10px;border-radius:100px;background:transparent;font-size:13px;color:var(--danger)}
.odtoggle:hover{background:var(--dangerSoft)}
.fcal{margin-inline-start:auto;border:0;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:12px;background:transparent;text-align:start}
.fcal:hover{background:var(--surface)}
.fcal .d{display:flex;flex-direction:column;line-height:1.35}
.fcal .d b{font-size:13px;font-weight:600;color:var(--textStrong)}
.fcal .d span{font-size:12px;color:var(--textMuted)}
.fsec{display:flex;flex-direction:column;gap:12px}
.fsh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fsh h3{margin:0;font-size:13px;font-weight:600;color:var(--textSecondary)}
.fsh h3 span{font-weight:500;color:var(--textMuted)}
.pp{display:inline-flex;align-items:center;gap:3px}
.pp i{width:16px;height:6px;border-radius:100px;background:var(--field);box-shadow:inset 0 0 0 1px var(--fieldLabel);transition:background-color .3s}
.pp i.planned{background:color-mix(in srgb,var(--textStrong) 45%,var(--field));box-shadow:none}
.pp i.done{background:var(--textStrong);box-shadow:none}
.slink{border:0;display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 12px;border-radius:100px;background:transparent;font-size:12px;font-weight:500;color:var(--textSecondary)}
.slink[aria-expanded=true]{background:var(--dividerDark)}
.fcard{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 16px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--cardShadow);transition:box-shadow .2s}
.fcard.now{box-shadow:var(--cardShadow),inset 0 0 0 1px var(--heading)}
.fcard .sc{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;margin:-4px 0 -4px -6px}
.fchk{width:32px;height:32px;padding:0;border:0;border-radius:100px;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.fchk i{width:20px;height:20px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:inset 0 0 0 1.6px var(--textMuted);transition:background-color .15s,box-shadow .15s}
.fchk:hover i{box-shadow:inset 0 0 0 1.6px var(--textSecondary)}
.fchk i.on{background:var(--accent);box-shadow:inset 0 0 0 1.6px var(--accent)}
.fchk i.pop{animation:fpop .18s ease-out}
@keyframes fpop{from{transform:scale(.8)}to{transform:scale(1)}}
.fchk path{stroke-dasharray:1;stroke-dashoffset:0}
.fchk i.pop path{animation:fdraw .18s ease-out both}
@keyframes fdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fcard .ix{font-size:12px;line-height:14px;color:var(--textMuted)}
.fcard .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;transition:opacity .2s}
.fcard.isdone .bd{opacity:.55}
.fcard .tt{font-size:16px;font-weight:500;line-height:24px;letter-spacing:-.4px;color:var(--textStrong)}
.fcard.isdone .tt{text-decoration:line-through}
.fcard .mt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.nowb{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:100px;box-shadow:inset 0 0 0 1px var(--heading);font-weight:600;color:var(--heading)}
.fopen{height:30px;padding:0 12px;border:0;border-radius:100px;background:transparent;box-shadow:inset 0 0 0 1px var(--dividerDark);font-size:12px;font-weight:500;color:var(--textSecondary);opacity:0;transition:opacity .15s}
.fcard:hover .fopen,.fcard:focus-within .fopen,.fopen.isnow{opacity:1}
@media (hover:none){.fopen{opacity:1}}
.fopen:hover{background:var(--field);color:var(--heading)}
.slot{display:flex;align-items:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;border:1px dashed var(--ghost);background:transparent;font-size:13px;font-weight:500;color:var(--textMuted);text-align:start}
.slot:hover{background:var(--surface);color:var(--textSecondary)}
.chooser{border-radius:16px;background:var(--surface);box-shadow:var(--cardShadow);padding:10px;display:flex;flex-direction:column;gap:1px;animation:popIn .15s ease both}
.chooser .hd{padding:9px 11px 7px;font-size:12px;color:var(--textMuted)}
.crow{border:0;display:flex;align-items:center;gap:12px;text-align:start;padding:11px;border-radius:11px;background:transparent}
.crow:hover{background:var(--field2)}
.crow[aria-pressed=true]{background:var(--accentSoft)}
.crow[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.crow .bx{flex-shrink:0;width:17px;height:17px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--ghost)}
.crow[aria-pressed=true] .bx{background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.crow .t{flex:1;min-width:0;font-size:13px;color:var(--textStrong)}
.alldone{display:flex;align-items:center;gap:12px;padding:18px 22px;border-radius:16px;background:var(--accentSoft);animation:popIn .2s ease both}
.alldone b{font-size:15px;font-weight:600;color:var(--accentText)}
.capture{display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;border:1px dashed var(--dividerDark);background:transparent;color:var(--textMuted);transition:background-color .15s,border-color .15s}
.capture:focus-within{background:var(--surface);border-color:var(--ghost)}
.capture input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:14px;color:var(--textStrong)}
.fst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(84px,1fr);gap:12px}
.fsticky{display:flex;flex-direction:column;gap:4px;padding:14px 15px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--checkRing)}
.fsticky b{font-size:13px;font-weight:600;line-height:19px;color:var(--textStrong)}
.fsticky span{font-size:12px;line-height:18px;color:var(--textSecondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fsadd{display:flex;align-items:center;gap:9px;padding:14px 15px;border-radius:14px;border:1px dashed var(--ghost);color:var(--textMuted)}
.fsadd input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:13px;color:var(--textStrong)}

.wall{position:fixed;inset:0;z-index:30;background:var(--veil);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:veilIn .15s ease both;overflow:hidden}
.wallbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:100px;background:var(--surface);box-shadow:0 8px 24px rgba(20,16,12,.18);z-index:2;white-space:nowrap}
.wallbar b{font-size:12px;font-weight:700;color:var(--heading)}
.wallbar button{border:0;border-radius:100px;padding:4px 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.wnote{position:absolute;width:200px;min-height:120px;border-radius:10px;padding:12px 13px;box-shadow:0 10px 26px rgba(20,16,12,.16),inset 0 0 0 1px rgba(20,16,12,.05);cursor:grab;touch-action:none;user-select:none;animation:composerIn .25s var(--ease) both;transition:box-shadow .15s}

.wnote b{display:block;font-size:13px;font-weight:700;color:var(--textStrong);margin-bottom:4px}
.wnote p{margin:0;font-size:12.5px;line-height:20px;color:var(--textSecondary);white-space:pre-line}

/* ---------- Toast ---------- */
.toast{position:fixed;z-index:60;bottom:16px;right:16px;width:340px;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--surface);box-shadow:0 12px 32px rgba(20,16,12,.16),inset 0 0 0 1px var(--divider);animation:toastIn .25s var(--ease) both}
.toast .b{flex:1;min-width:0}
.toast .t{font-size:13px;font-weight:600;color:var(--heading)}
.toast .d{font-size:12px;color:var(--textMuted)}
.toast button{flex-shrink:0;height:30px;border:0;border-radius:8px;padding:0 12px;font-size:12px;font-weight:600;background:var(--field);color:var(--textStrong)}
.toast button:hover{background:var(--dividerDark)}
@media (max-width:767px){.toast{bottom:auto;top:12px;right:12px;left:12px;width:auto;margin:0 auto}}

@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes veilIn{from{opacity:0}to{opacity:1}}

@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pageEnter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pageExit{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-4px)}}
#view.enter{animation:pageEnter .22s var(--ease) both}
#view.exit{animation:pageExit .16s ease-in both;pointer-events:none}

/* View Transitions */
::view-transition-old(page){animation:pageExit .16s ease-in both}
::view-transition-new(page){animation:pageEnter .26s var(--ease) .06s both}
html[data-vt=morph]::view-transition-old(page),html[data-vt=morph]::view-transition-new(page){animation:none}
html[data-vt=morph]::view-transition-old(page){display:none}

::view-transition-old(morph),::view-transition-new(morph){height:100%;width:100%;object-fit:fill}
::view-transition-old(morph){animation:vtFadeOut .2s ease both}
::view-transition-new(morph){animation:vtFadeIn .3s ease .05s both}
@keyframes vtFadeOut{to{opacity:0}}
@keyframes vtFadeIn{from{opacity:0}}
::view-transition-group(side),::view-transition-group(mnav),::view-transition-group(mhead){animation-duration:.2s}

html.thumb body{pointer-events:none}
html.thumb ::-webkit-scrollbar{display:none}
html.thumb *{scrollbar-width:none}

@media (prefers-reduced-motion:reduce){

  var k = e.target.getAttribute && e.target.getAttribute('data-in');
  if (k === 'query') { S.query = e.target.value; var pos = e.target.selectionStart; renderViewOnly(); var n = view.querySelector('[data-in=query]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (k === 'nquery') { S.noteQuery = e.target.value; var p2 = e.target.selectionStart; renderViewOnly(); var n2 = view.querySelector('[data-in=nquery]'); if (n2) { n2.focus(); n2.setSelectionRange(p2, p2); } }
  else if (k === 'waiting') { var t = T(S.openTask); if (t) t.waiting = e.target.value.trim() || null; }
  else if (e.target.id === 'qa-in') updateQuickChips();
});
document.addEventListener('keydown', function (e) {
  var tg = e.target, k = tg.getAttribute && tg.getAttribute('data-in');
  if (e.key === 'Enter' && !e.isComposing) {
    if (tg.id === 'qa-in') { e.preventDefault(); submitQuick(); return; }
    if (tg.hasAttribute && tg.hasAttribute('data-col-add')) {
      e.preventDefault(); var v = tg.value.trim(); if (!v) { toast('اكتب اسم المهمة أولًا'); return; }
      addColTask(tg.getAttribute('data-col-add'), v); return;
    }
    if (k === 'capture') { e.preventDefault(); captureAdd(tg.value.trim()); return; }
    if (k === 'stepadd') { e.preventDefault(); var t = T(S.openTask); if (t && tg.value.trim()) { t.steps.push({ t: tg.value.trim(), d: false }); renderOverlay(); renderViewOnly(); var si = overlay.querySelector('[data-in=stepadd]'); if (si) si.focus(); } return; }
    if (k === 'fsticky') { e.preventDefault(); if (tg.value.trim()) { D.notes.unshift({ id: 'n' + (++uid), title: tg.value.trim(), body: '', kind: 'note', sticky: true, color: ['yellow', 'pink', 'blue', 'green', 'purple'][uid % 5], tags: [], upd: 0 }); renderViewOnly(); renderChrome(); } return; }
    if (k === 'waiting') { tg.blur(); return; }
  }
  if (e.key === 'Escape') {
    if (S.quick) { S.quick = false; renderOverlay(); return; }
    if (S.wall) { S.wall = false; renderOverlay(); return; }
    if (S.openNote) { closeNote(false); return; }
    if (S.stMenu) { S.stMenu = false; renderOverlay(); return; }
    if (S.openTask) { closeDetail(); return; }
    if (S.screen === 'focus') { go('overview'); return; }
  }
  var typing = /INPUT|TEXTAREA/.test(tg.tagName);
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'n' || e.key === 'N' || e.key === 'ى') && !S.quick && S.screen !== 'focus') { e.preventDefault(); S.quick = true; S.quickSaved = null; renderOverlay(); setTimeout(function () { var q = document.getElementById('qa-in'); if (q) q.focus(); }, 30); }
});
document.addEventListener('scroll', function (e) { if (e.target && e.target.id === 'board') updateStepBtns(); }, true);
var lastPhone = isPhone();
window.addEventListener('resize', function () { var p = isPhone(); if (p !== lastPhone) { lastPhone = p; renderViewOnly(); } else updateStepBtns(); });

function addColTask(stage, title) {
  var p = parseQuick(title);
  var t = { id: 'c' + (++uid), title: p.title || title, desc: '', stage: stage, due: p.due, tags: p.tags, idle: 0, steps: [] };
  D.tasks.push(t); S.newId = t.id;
  renderViewOnly(); renderChrome();
  var inp = view.querySelector('[data-col-add="' + stage + '"]'); if (inp) inp.focus();
  var card = view.querySelector('[data-task="' + t.id + '"]'); if (card) card.scrollIntoView({ block: 'nearest', behavior: RM.matches ? 'auto' : 'smooth' });
  setTimeout(function () { if (S.newId === t.id) { S.newId = null; var c = view.querySelector('[data-task="' + t.id + '"]'); if (c) c.classList.remove('new'); } }, 2200);
}
function captureAdd(v) {
  if (!v) return;
  var t = { id: 'f' + (++uid), title: v, desc: '', stage: 'today', due: 0, tags: [], idle: 0, steps: [] };
  D.tasks.push(t);
  var full = D.plan.length >= 5;
  if (!full) D.plan.push(t.id); else t.stage = 'not_started';
  renderViewOnly(); renderChrome();
  toast(full ? 'الخطة مكتملة — حُفظت في «لم يبدأ»' : 'أُضيفت لخطة اليوم', v, function () { D.tasks = D.tasks.filter(function (x) { return x !== t; }); D.plan = D.plan.filter(function (x) { return x !== t.id; }); renderViewOnly(); renderChrome(); });
  var c = view.querySelector('[data-in=capture]'); if (c) c.focus();
}

/* sticky wall dragging */
var drag = null;
document.addEventListener('pointerdown', function (e) {
  var n = e.target.closest('.wnote'); if (!n) return;
  var note = null; D.notes.forEach(function (x) { if (x.id === n.getAttribute('data-wid')) note = x; });
  drag = { el: n, note: note, dx: e.clientX - n.offsetLeft, dy: e.clientY - n.offsetTop };
  n.classList.add('drag'); n.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var x = Math.max(0, Math.min(window.innerWidth - 60, e.clientX - drag.dx)), y = Math.max(56, Math.min(window.innerHeight - 40, e.clientY - drag.dy));
  drag.el.style.left = x + 'px'; drag.el.style.top = y + 'px'; drag.note.x = x; drag.note.y = y;
});
document.addEventListener('pointerup', function () { if (drag) { drag.el.classList.remove('drag'); drag = null; } });

/* ---------------- parent API ---------------- */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'pw:screen' && d.id) { if (THUMB) stopDemo(); go(d.id); }
});

/* ---------------- thumb autoplay ---------------- */
var demoTimers = [], demoIdx = 0, demoOn = false;
function later(fn, ms) { demoTimers.push(setTimeout(fn, ms)); }
function stopDemo() { demoOn = false; demoTimers.forEach(clearTimeout); demoTimers = []; }
function typeInto(inp, text, done) {
  var i = 0; inp.focus();
  (function step() { if (!demoOn) return; inp.value = text.slice(0, ++i); inp.dispatchEvent(new Event('input', { bubbles: true })); if (i < text.length) later(step, 55); else later(done, 280); })();
}
var DEMO = ['overview', 'tasks', 'task', 'notes', 'focus'];
function demoStep() {
  if (!demoOn) return;
  var id = DEMO[demoIdx % DEMO.length];
  if (id === 'overview' && demoIdx > 0) { D = seed(); S.leaving = {}; S.filter = 'open'; S.mStage = 'today'; S.chooser = false; S.noteFilter = 'all'; }
  if (S.screen !== id) go(id); else announce();
  if (id === 'overview') later(function () { var r = todayRows()[0]; if (r) completeTask(r.id); }, 1500);
  if (id === 'tasks') later(function () {
    if (isPhone()) { S.mStage = 'in_progress'; renderViewOnly(); later(function () { S.mStage = 'today'; renderViewOnly(); }, 1200); return; }
    var inp = view.querySelector('[data-col-add="today"]'); if (!inp) return;
    typeInto(inp, 'مراجعة عقد الصيانة #عمل', function () { addColTask('today', inp.value); var n = view.querySelector('[data-col-add="today"]'); if (n) n.blur(); });
  }, 700);
  if (id === 'task') later(function () { var t = T('t1'); if (t && S.openTask === 't1') { t.steps[2].d = true; renderOverlay(); } }, 1700);
  if (id === 'notes') later(function () { S.noteFilter = 'meeting'; markFresh(); renderViewOnly(); later(function () { S.noteFilter = 'all'; markFresh(); renderViewOnly(); }, 1300); }, 900);
  if (id === 'focus') later(function () { var v = planView(); if (v.nowAt >= 0) focusToggle(v.items[v.nowAt].id); }, 1300);
  demoIdx++;
  later(demoStep, id === 'task' ? 3500 : 3500);
}

/* ---------------- boot ---------------- */
var initial = params.get('screen');
if (!SCREENS.some(function (s) { return s.id === initial; })) initial = 'overview';
if (initial === 'task') { S.screen = 'task'; S.openTask = 't1'; } else S.screen = initial;
markFresh(); render();
post({ type: 'pw:ready', slug: SLUG, screens: SCREENS.map(function (s) { return { id: s.id, label: s.label }; }) });
announce();
if (THUMB) { demoOn = true; demoIdx = Math.max(0, DEMO.indexOf(S.screen)); later(function () { demoIdx++; demoStep(); }, 3500); runFirstMicro(); }
function runFirstMicro() {
  if (S.screen === 'overview') later(function () { var r = todayRows()[0]; if (r) completeTask(r.id); }, 1600);
  if (S.screen === 'focus') later(function () { var v = planView(); if (v.nowAt >= 0) focusToggle(v.items[v.nowAt].id); }, 1600);
}
})();
</script>
</body>
