<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المراكز | Journal Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --background:hsl(40 20% 98%);--foreground:hsl(220 25% 10%);
  --card:#fff;--primary:hsl(215 70% 35%);--primary-rgb:27 79 152;
  --secondary:hsl(40 30% 93%);--muted:hsl(40 15% 94%);--muted-fg:hsl(220 10% 46%);
  --accent:hsl(175 45% 40%);--destructive:hsl(0 72% 50%);
  --border:hsl(220 15% 88%);--radius:.625rem;
  --sb:hsl(215 70% 12%);--sb-fg:hsl(215 20% 90%);--sb-accent:hsl(215 60% 20%);--sb-border:hsl(215 50% 18%);
  --sbw:16rem;--sbw-icon:3rem;
  --ease:cubic-bezier(.22,.8,.25,1);
}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
textarea,input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i5{width:20px;height:20px}svg.i7{width:28px;height:28px}svg.i3{width:12px;height:12px}
.app{display:flex;height:100vh;width:100%}
/* ---------- Sidebar ---------- */
.sb{width:var(--sbw);flex-shrink:0;background:var(--sb);color:var(--sb-fg);display:flex;flex-direction:column;transition:width .25s var(--ease),transform .3s var(--ease);overflow:hidden;z-index:30;border-inline-start:1px solid var(--sb-border)}
.sb-content{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sb-brand{padding:12px 16px}
.sb-brand h2{margin:0;font-size:18px;font-weight:700;color:hsl(215 70% 62%);white-space:nowrap}
.sb-group{padding:4px 8px;position:relative}
.sb-label{height:28px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:500;color:hsl(215 20% 90% / .7);white-space:nowrap}
.sb-menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sb-item{display:flex;align-items:center;gap:8px;height:32px;width:100%;padding:0 8px;border-radius:6px;font-size:14px;text-align:start;white-space:nowrap;transition:background .15s,color .15s}
.sb-item:hover{background:hsl(40 15% 94% / .5)}
.sb-item.active{background:var(--muted);color:var(--primary);font-weight:500}
.sb-foot{padding:8px;border-top:1px solid var(--sb-border)}
.sb-user{padding:8px;font-size:13px;color:hsl(215 20% 90% / .65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-logout{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border-radius:6px;font-size:14px}
.sb-logout:hover{background:var(--sb-accent)}
.collapsed .sb{width:var(--sbw-icon)}
.collapsed .sb .txt,.collapsed .sb-brand,.collapsed .sb-user,.collapsed .sb-label span{display:none}
.collapsed .sb-item,.collapsed .sb-logout{justify-content:center;padding:0}
.sb-backdrop{display:none}
/* ---------- Main ---------- */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.hdr{height:56px;display:flex;align-items:center;border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0;background:var(--background)}
.hdr .sp{flex:1}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:500;transition:background .15s}
.ghost:hover{background:var(--secondary)}
.ghost.icon{width:36px;padding:0;position:relative}
.ghost.sm{height:32px;padding:0 10px}
.bell-badge{position:absolute;top:-4px;inset-inline-end:-4px;height:20px;min-width:20px;border-radius:999px;background:var(--destructive);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;transition:transform .3s var(--ease)}
.bell-badge.pop{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:hsl(220 15% 80%) transparent}
.tbl-wrap,.kanban{scrollbar-width:thin;scrollbar-color:hsl(220 15% 80%) transparent}
#view{view-transition-name:page;max-width:1280px;margin:0 auto}
/* ---------- Primitives ---------- */
h1{font-size:30px;font-weight:700;margin:0;line-height:1.2;letter-spacing:-.01em}
.muted{color:var(--muted-fg)}.xs{font-size:12px}.sm{font-size:14px}
.stack>*+*{margin-top:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.card-h{padding:24px 24px 0}.card-t{font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.card-c{padding:24px}.card-h+.card-c{padding-top:16px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;transition:background .3s,color .3s}
.b-secondary{background:var(--secondary)}.b-outline{border-color:var(--border);color:var(--foreground)}
.s-draft{background:var(--muted);color:var(--muted-fg)}
.s-submitted{background:#dbeafe;color:#1e40af}.s-under_review{background:#fef9c3;color:#854d0e}
.s-revision_required{background:#ffedd5;color:#9a3412}.s-revised{background:#f3e8ff;color:#6b21a8}
.s-accepted{background:#dcfce7;color:#166534}.s-rejected{background:#fee2e2;color:#991b1b}
.s-published{background:#d1fae5;color:#065f46}.s-withdrawn{background:#f3f4f6;color:#1f2937}
.b-destructive{background:var(--destructive);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:6px;font-size:14px;font-weight:500;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:hsl(215 70% 31%)}
.btn-outline{border:1px solid var(--border);background:var(--background)}.btn-outline:hover{background:var(--secondary)}
.btn-sm{height:36px;padding:0 12px}.btn-w{width:100%}.btn-start{justify-content:flex-start}
.btn[disabled]{opacity:.5;pointer-events:none}
.input{height:40px;border:1px solid var(--border);border-radius:6px;background:var(--background);padding:0 12px;font-size:14px;width:100%;max-width:320px;outline:none;transition:box-shadow .15s}
.input:focus,.trigger:focus-visible,textarea:focus{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--primary);outline:none}
textarea.ta{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--background);padding:8px 12px;font-size:14px;resize:none;outline:none}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* select */
.sel{position:relative;width:192px}
.trigger{display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;border:1px solid var(--border);border-radius:6px;background:var(--background);padding:0 12px;font-size:14px;text-align:start}
.trigger svg{opacity:.5}
.menu{position:absolute;top:calc(100% + 4px);inset-inline:0;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgb(15 23 42 / .12);padding:4px;z-index:60;max-height:260px;overflow:auto;animation:menuIn .16s var(--ease)}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;padding-inline-start:28px;border-radius:4px;font-size:14px;text-align:start;position:relative}
.opt:hover,.opt.kb{background:var(--secondary)}
.opt .ck{position:absolute;inset-inline-start:8px}
/* stat cards */
.grid{display:grid;gap:12px}
.g2-4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.stat{cursor:pointer;text-align:center;padding:12px 8px 8px;transition:box-shadow .2s,border-color .2s,transform .2s}
.stat:hover{box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.stat.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{height:48px;padding:0 16px;text-align:start;font-weight:500;color:var(--muted-fg);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:hsl(40 15% 94% / .5)}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
.fw{font-weight:500}.nw{white-space:nowrap}
.ttl{display:inline-block}
.row-in{animation:rowIn .35s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:512px;background:var(--muted);border-radius:6px;padding:4px;height:40px;position:relative}
.tab{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:4px;font-size:14px;font-weight:500;color:var(--muted-fg);position:relative;z-index:1;transition:color .2s}
.tab.on{color:var(--foreground)}
.tab-ind{position:absolute;top:4px;bottom:4px;border-radius:4px;background:var(--background);box-shadow:0 1px 2px rgb(0 0 0 / .08);transition:inset-inline-start .3s var(--ease);width:calc((100% - 8px)/4)}
.tabpane{margin-top:16px;animation:fadeUp .35s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.g-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
svg.chart{width:100%;height:280px;display:block;overflow:visible;direction:ltr}
svg.chart text{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;font-size:12px;fill:#666}
.grow-x{transform-box:fill-box;transform-origin:left center;animation:growX .9s var(--ease) both}
.grow-y{transform-box:fill-box;transform-origin:center bottom;animation:growY .9s var(--ease) both}
@keyframes growX{from{transform:scaleX(0)}}@keyframes growY{from{transform:scaleY(0)}}
.draw{animation:draw 1.3s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.pie-sweep{animation:sweep 1.1s var(--ease) both}
@keyframes sweep{from{stroke-dashoffset:629}to{stroke-dashoffset:0}}
.fade-late{animation:fadeIn .5s .8s both}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;margin-inline-end:4px;vertical-align:middle}
/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;min-height:400px}
.kcol{min-width:240px;max-width:280px;flex-shrink:0}
.kcard{padding:12px;display:block;width:100%;text-align:start;cursor:pointer;transition:box-shadow .2s,transform .2s}
.kcard:hover{box-shadow:0 4px 12px rgb(0 0 0 / .08);transform:translateY(-1px)}
.kcard+.kcard{margin-top:8px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.late{color:#ea580c;display:inline-flex;align-items:center;gap:2px;font-size:12px}
.empty-dash{text-align:center;font-size:12px;color:var(--muted-fg);padding:32px 0;border:1px dashed var(--border);border-radius:var(--radius)}
/* paper detail */
.pd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pd-head h1{font-size:24px;flex:1;min-width:200px}
.pd-grid{display:grid;grid-template-columns:1fr 2fr;gap:24px;align-items:start}
.sep{height:1px;background:var(--border);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:8px}
.stepper{display:flex;align-items:flex-start;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.step{display:flex;align-items:flex-start;flex:1;min-width:110px}
.step-col{display:flex;flex-direction:column;align-items:center;flex:1}
.dot{height:36px;width:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:2px solid var(--muted);color:var(--muted-fg);background:var(--background);transition:all .45s var(--ease)}
.dot.done{background:var(--primary);border-color:var(--primary);color:#fff}
.dot.cur{background:rgb(var(--primary-rgb) / .1);border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px rgb(var(--primary-rgb) / .15)}
.dot.cur.pulse{animation:ring 1.6s ease-out 1}
@keyframes ring{0%{box-shadow:0 0 0 0 rgb(var(--primary-rgb) / .45)}70%{box-shadow:0 0 0 14px rgb(var(--primary-rgb) / 0)}100%{box-shadow:0 0 0 4px rgb(var(--primary-rgb) / .15)}}
.step-lbl{font-size:12px;margin-top:8px;text-align:center;line-height:1.25;color:var(--muted-fg);transition:color .3s}
.step-lbl.cur{color:var(--foreground);font-weight:600}
.bar{flex:1;height:2px;margin:17px 4px 0;min-width:20px;background:var(--muted);position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;background:var(--primary);transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease)}
.bar.done::after{transform:scaleX(1)}
.where{border-color:rgb(var(--primary-rgb) / .3);background:rgb(var(--primary-rgb) / .05)}
.wrow{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
.wrow p{margin:0}
.ok{color:#16a34a}.amber{color:#d97706}
.next{margin-top:12px;display:flex;gap:8px;align-items:flex-start;border:1px solid rgb(var(--primary-rgb) / .4);background:var(--background);border-radius:6px;padding:12px}
.acc{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:0 16px}
.acc+.acc{margin-top:8px}
.acc-t{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 0;font-size:16px;font-weight:600;text-align:start}
.acc-t:hover .lbl{text-decoration:underline}
.acc-t .chev{transition:transform .25s}
.acc.open .acc-t .chev{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.acc-b>div>div{padding-bottom:16px}
.report{border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.report+.report{margin-top:16px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{display:flex;justify-content:space-between;background:var(--muted);border-radius:4px;padding:8px;font-size:14px}
.note{background:var(--muted);border-radius:4px;padding:8px;font-size:14px;margin-top:4px}
.conf{border-inline-start:2px solid var(--destructive)}
.tl{display:flex;gap:16px}
.tl-dot{border-radius:999px;padding:6px;background:var(--muted);color:var(--muted-fg);display:flex}
.tl-dot.last{background:var(--primary);color:#fff}
.tl-line{width:1px;flex:1;background:var(--border);margin-top:4px}
.tl.new{animation:fadeUp .5s var(--ease)}
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:16px;font-size:14px}
.tally>span{display:flex;align-items:center;gap:4px}
/* inbox */
.ib-item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);border-radius:var(--radius);padding:12px;width:100%;text-align:start;transition:background .15s}
.ib-item:hover{background:hsl(40 15% 94% / .5)}
.ib-item+.ib-item{margin-top:8px}
.ib-item p{margin:0}
.ms-auto{margin-inline-start:auto}
/* messages */
.thread-h{display:flex;align-items:center;justify-content:space-between;padding:24px;cursor:pointer;width:100%;text-align:start}
.thread-h:hover{background:hsl(40 15% 94% / .35)}
.thread-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.thread.open .thread-b{grid-template-rows:1fr}
.thread-b>div{overflow:hidden}
.thread-b>div>div{padding:0 24px 24px}
.msg{border-radius:var(--radius);padding:12px}
.msg+.msg{margin-top:12px}
.msg.me{background:rgb(var(--primary-rgb) / .1);margin-inline-start:32px}
.msg.them{background:var(--muted);margin-inline-end:32px}
.msg p{margin:0}
.msg.new{animation:fadeUp .4s var(--ease)}
.thread+.thread{margin-top:12px}
.unread-dot{width:8px;height:8px;border-radius:99px;background:var(--primary);display:inline-block}
/* dialog */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .8);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s both}
.dialog{background:var(--background);border:1px solid var(--border);border-radius:8px;box-shadow:0 20px 50px rgb(0 0 0 / .25);width:100%;max-width:512px;padding:24px;position:relative;animation:dlgIn .25s var(--ease) both}
@keyframes dlgIn{from{opacity:0;transform:scale(.95)}}
.overlay.out{animation:fadeOut .18s both}.overlay.out .dialog{animation:dlgOut .18s both}
@keyframes fadeOut{to{opacity:0}}@keyframes dlgOut{to{opacity:0;transform:scale(.96)}}
.dialog h3{margin:0 0 16px;font-size:18px;font-weight:600}
.dialog .x{position:absolute;top:16px;inset-inline-end:16px;opacity:.7}
.field+.field{margin-top:16px}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.field .sel{width:100%}
/* toast */
#toaster{position:fixed;bottom:24px;left:24px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 12px rgb(0 0 0 / .1);padding:14px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;min-width:240px;animation:toastIn .35s var(--ease) both}
.toast.out{animation:toastOut .3s both}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}}@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
/* view transitions */
::view-transition-old(page){animation:vtOut .22s ease both}
::view-transition-new(page){animation:vtIn .38s var(--ease) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
::view-transition-group(paper-title){animation-duration:.5s;animation-timing-function:var(--ease)}
::view-transition-old(paper-title),::view-transition-new(paper-title){height:100%;object-fit:none;object-position:right center}
.fb-out{animation:vtOut .18s ease both}.fb-in{animation:vtIn .34s var(--ease) both}
/* responsive */
@media (max-width:1279px){.g6{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1023px){.pd-grid{grid-template-columns:1fr}.g-2{grid-template-columns:1fr}}
@media (max-width:767px){
  .g6,.g2-4{grid-template-columns:repeat(2,1fr)}
  .sb{position:fixed;top:0;bottom:0;right:0;width:18rem !important;transform:translateX(100%)}
  .m-open .sb{box-shadow:0 0 40px rgb(0 0 0 / .3)}
  td:first-child{min-width:220px}
  .collapsed .sb .txt,.collapsed .sb-brand,.collapsed .sb-user{display:revert}
  .collapsed .sb-item{justify-content:flex-start;padding:0 8px}
  .m-open .sb{transform:none}
  .m-open .sb-backdrop{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .8);z-index:25;animation:fadeIn .2s}
  main{padding:16px}
  h1{font-size:24px}
  .tab .tl-txt{display:none}
  .lang-txt{display:none}
  .input{max-width:none}
  .sel{width:100%}
  .msg.me{margin-inline-start:16px}.msg.them{margin-inline-end:16px}
  .thread-h{padding:16px}.thread-b>div>div{padding:0 16px 16px}
  .scores{grid-template-columns:1fr}
  #toaster{right:12px;left:12px}
  .card-h{padding:16px 16px 0}.card-c{padding:16px}
}
/* thumb mode */
.thumb main{scroll-behavior:auto}
.thumb *{cursor:default !important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0s !important;transition-duration:.001ms !important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sb" id="sb" aria-label="القائمة الجانبية"></aside>
  <div class="sb-backdrop" id="backdrop"></div>

function statusRows(p){
  var g=p.stage,rows=[],next=null;
  if(g<1)rows.push(['التحكيم','todo','لم تتم دعوة محكمين بعد']);
  else if(g===1)rows.push(['التحكيم','pending','استُلم 1 من 2 تقرير']);
  else rows.push(['التحكيم','done','اكتملت كل التقارير (2/2)']);
  if(g<2)rows.push(['اللجنة','todo','لم يُرسل البحث إلى لجنة بعد']);
  else if(g===2)rows.push(['اللجنة','pending','صوّت 2 من 3 عضو']);
  else rows.push(['اللجنة','done','اكتمل التصويت (3/3 موافقة)']);
  if(g<3){rows.push(['قرار للباحث','todo','لم يُرسل قرار للباحث بعد']);rows.push(['رد الباحث','todo','—']);}
  else{rows.push(['قرار للباحث','done','أُرسل القرار (accept) في '+fmtDate(shift(p.d,27))]);rows.push(['رد الباحث',g>=4?'done':'pending',g>=4?'ردّ الباحث / أعاد التقديم':'بانتظار رد الباحث']);}
  if(g===0)next='ابدأ بدعوة محكمين أو إرسال البحث للجنة';
  else if(g===1)next='أرسل البحث إلى لجنة للتصويت';
  else if(g===2)next='بانتظار اكتمال تصويت اللجنة';
  else if(g===3)next='أرسل قرار اللجنة إلى الباحث';
  if(p.s==='revision_required')next='بانتظار تعديلات الباحث';
  return {rows:rows,next:next};
}

/* ================= Navigation ================= */
function paint(id){
  S.screen=id;
  view.innerHTML=RENDER[id]();
  renderSidebar();
  mainEl.scrollTop=0;
  animateCounters(view);
}
var navBusy=false;
function go(id,opts){
  opts=opts||{};
  if(!RENDER[id])return;
  if(id===S.screen&&!opts.force)return;
  closeSel();closeDlg(true);app.classList.remove('m-open');
  var from=S.screen;
  // Shared-element morph: give the source title the transition name
  if(opts.morphEl){opts.morphEl.style.viewTransitionName='paper-title';}
  S.morph=(from==='paper'&&id==='papers')?S.paperId:null;
  var done=function(){S.morph=null;var m=view.querySelector('[style*="paper-title"]');if(m&&S.screen!=='paper')m.style.viewTransitionName='';notify(id);};
  if(document.startViewTransition&&!RM&&from){
    try{
      var vt=document.startViewTransition(function(){paint(id);});
      vt.finished.then(done,done);
      return;
    }catch(e){}
  }
  if(from&&!RM){
    view.classList.add('fb-out');
    setTimeout(function(){view.classList.remove('fb-out');paint(id);view.classList.add('fb-in');setTimeout(function(){view.classList.remove('fb-in');},360);done();},170);
  }else{paint(id);done();}
}
function notify(id){try{if(window.parent!==window)window.parent.postMessage({type:'pw:screen-changed',slug:'jms',id:id},'*');}catch(e){}}
function openPaper(id,el){S.paperId=id;S.openAcc={reports:true};var t=el&&el.querySelector('[data-tid="'+id+'"]');go('paper',{force:true,morphEl:t});}

function setPapersFilter(v){
  S.papersFilter=v;
  var t=document.getElementById('ptable');if(!t)return;
  var tr=document.querySelector('[data-sel="pStatus"] .trigger span');if(tr)tr.textContent=v==='all'?'الكل':ST[v];
  document.querySelectorAll('[data-pstat]').forEach(function(c){c.classList.toggle('on',c.getAttribute('data-pstat')===v);});
  var swap=function(){t.innerHTML=papersTable();};
  if(document.startViewTransition&&!RM){t.style.viewTransitionName='ptable';var vt=document.startViewTransition(swap);vt.finished.then(function(){t.style.viewTransitionName='';},function(){});}else swap();
}
function setOpsTab(tab){
  if(S.opsTab===tab)return;S.opsTab=tab;
  var tabs=['analytics','kanban','delayed','reviewers'],i=tabs.indexOf(tab);
  view.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===tab);});
  var ind=view.querySelector('.tab-ind');if(ind)ind.style.insetInlineStart='calc(4px + '+i+' * (100% - 8px)/4)';
  var pane=document.getElementById('tabpane');if(pane)pane.innerHTML=opsPane();
}
function setOpsFilter(s){
  S.opsFilter=S.opsFilter===s?'all':s;
  view.querySelectorAll('[data-opsstat]').forEach(function(c){c.classList.toggle('on',c.getAttribute('data-opsstat')===S.opsFilter);});
  if(S.opsFilter!=='all'&&S.opsTab!=='kanban')setOpsTab('kanban');
  else{var pane=document.getElementById('tabpane');if(pane)pane.innerHTML=opsPane();}
}

var dlgNew={};
function statusDialog(){
  var p=P(S.paperId),ns=Math.min(p.stage+1,4);
  var autoStatus=['submitted','under_review','under_review','accepted','published'][ns];
    dlgNew={status:autoStatus,stage:ns};
  SEL.dStatus={val:function(){return dlgNew.status;},opts:function(){return FLOW.filter(function(s){return s!==p.s;}).map(function(s){return [s,ST[s]];});},set:function(v){dlgNew.status=v;document.querySelector('[data-sel="dStatus"] .trigger span').textContent=ST[v];}};
  SEL.dStage={val:function(){return String(dlgNew.stage);},opts:function(){return STAGES.map(function(s,i){return [String(i),s];});},set:function(v){dlgNew.stage=+v;document.querySelector('[data-sel="dStage"] .trigger span').textContent=STAGES[+v];}};

}
function applyStatus(){
  var p=P(S.paperId),notes=(document.getElementById('dNotes')||{}).value||'';
  p.s=dlgNew.status;var prev=p.stage;p.stage=dlgNew.stage;
  history(p).forEach(function(e){e.fresh=false;});
  history(p).push({a:'Status changed to '+p.s,st:p.stage,by:ME,d:new Date().toISOString(),n:notes||null,fresh:true});
  closeDlg();
  toast('تم تحديث الحالة');
  var swap=function(){
    document.getElementById('stepWrap').innerHTML=stepper(p,true);
    document.getElementById('hdBadge').innerHTML=badge(p.s);
    document.getElementById('curStage').textContent=STAGES[p.stage];
    S.openAcc.history=true;
    document.getElementById('pdMain').innerHTML=pdMain(p);
  };
  // animate stepper bar fill: render old then flip classes
  var ws=document.getElementById('stepWrap');
  if(!RM&&ws&&p.stage>prev){
    var bars=ws.querySelectorAll('.bar'),dots=ws.querySelectorAll('.dot');
    for(var i=prev;i<p.stage;i++){if(bars[i])bars[i].classList.add('done');}
    if(dots[prev]){dots[prev].classList.remove('cur');dots[prev].classList.add('done');dots[prev].innerHTML=ic('check');}
    setTimeout(swap,520);
  }else swap();
}
document.addEventListener('click',function(e){
  var t=e.target;

  var trg=t.closest('.trigger');
  if(trg){var wr=trg.closest('.sel');if(wr.querySelector('.menu'))closeSel();else openSel(wr);return;}
  closeSel();
  if(t.id==='ovl'){closeDlg();return;}
  var nav=t.closest('[data-nav]');
  if(nav){e.preventDefault();var n=nav.getAttribute('data-nav');if(RENDER[n]){stopAuto();go(n);}else toast('هذه الصفحة غير مضمّنة في المعاينة');return;}
  var pp=t.closest('[data-paper]');
  if(pp){stopAuto();openPaper(pp.getAttribute('data-paper'),pp);return;}
  var tab=t.closest('[data-tab]');if(tab){setOpsTab(tab.getAttribute('data-tab'));return;}
  var os=t.closest('[data-opsstat]');if(os){setOpsFilter(os.getAttribute('data-opsstat'));return;}
  var ps=t.closest('[data-pstat]');if(ps){var v=ps.getAttribute('data-pstat');setPapersFilter(S.papersFilter===v?'all':v);return;}

  var th=t.closest('.thread-h');if(th){toggleThread(th.parentNode.getAttribute('data-thread'));return;}
  var act=t.closest('[data-act]');
  if(act){
    var x=act.getAttribute('data-act');
    if(x==='status')statusDialog();
    else if(x==='closedlg')closeDlg();
    else if(x==='confirmdlg'){if(dlgState&&dlgState.confirm)dlgState.confirm();}
    else if(x==='reply')sendReply(act.closest('.thread'));
    else if(x==='csv')toast('تم تصدير '+PAPERS.length+' بحث إلى CSV');

    else if(x==='committee'){SEL.dCom={val:function(){return 'c1';},opts:function(){return [['c1','لجنة التحكيم العلمي'],['c2','لجنة النشر']];},set:function(v){document.querySelector('[data-sel="dCom"] .trigger span').textContent=v==='c1'?'لجنة التحكيم العلمي':'لجنة النشر';}};openDlg('إرسال البحث إلى لجنة','<div class="field"><label>اختر اللجنة</label>'+sel('dCom','c1',SEL.dCom.opts())+'</div><button class="btn btn-primary btn-w" style="margin-top:16px" data-act="confirmdlg">تأكيد</button>',function(){closeDlg();toast('تم إرسال البحث إلى اللجنة');});}
    else if(x==='assign'){openDlg('تعيين منسق للبحث','<p class="sm muted" style="background:hsl(40 15% 94% / .5);padding:12px;border-radius:6px;line-height:1.7;margin:0 0 16px">تعيين شخص من فريق المجلة كمسؤول إداري دائم عن البحث (محرر مسؤول أو منسق متابعة). لإرسال البحث لمحكم علمي لتقييمه، استخدم بدلاً من ذلك زر «إرسال طلب تحكيم» في قسم طلبات التحكيم بالأسفل.</p><div class="field"><label>البريد الإلكتروني</label><input class="input" dir="ltr" style="max-width:none" placeholder="editor@example.org"></div><button class="btn btn-primary btn-w" style="margin-top:16px" data-act="confirmdlg">تأكيد</button>',function(){closeDlg();toast('تم التعيين بنجاح');});}
    else if(x==='reqreview')toast('تم إرسال طلب التحكيم');
    else if(x==='file')toast('جاري تحميل الملف…');
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='pSearch'){S.search=e.target.value;document.getElementById('ptable').innerHTML=papersTable();}
  if(e.target.matches('.thread textarea')){var b=e.target.parentNode.querySelector('[data-act="reply"]');b.disabled=!e.target.value.trim();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSel();closeDlg();app.classList.remove('m-open');}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('.thread textarea')){e.preventDefault();sendReply(e.target.closest('.thread'));}
});
function toggleThread(id){
  S.openThread=S.openThread===id?null:id;
  view.querySelectorAll('.thread').forEach(function(c){
    var on=c.getAttribute('data-thread')===S.openThread;c.classList.toggle('open',on);
    var chev=c.querySelector('.tchev');if(chev)chev.innerHTML=ic(on?'cu':'cd');
    if(on){var dot=c.querySelector('.unread-dot');if(dot){dot.remove();THREADS.forEach(function(t){if(t.id===id)t.unread=false;});}}
  });
}
function sendReply(card,text){
  if(!card)return;var ta=card.querySelector('textarea'),v=(text||ta.value).trim();if(!v)return;
  var t=THREADS.filter(function(x){return x.id===card.getAttribute('data-thread');})[0];
  var m={me:true,who:ME,d:new Date().toISOString().slice(0,10),b:v,fresh:true};t.msgs.push(m);
  card.querySelector('.msgs').insertAdjacentHTML('beforeend',msgHtml(m));m.fresh=false;
  card.querySelector('.mc').textContent=t.msgs.length;
  ta.value='';card.querySelector('[data-act="reply"]').disabled=true;
  toast('تم إرسال الرد');
}
/* sidebar trigger */
document.getElementById('sbTrigger').addEventListener('click',function(){
  if(window.innerWidth<768)app.classList.toggle('m-open');else app.classList.toggle('collapsed');
});
document.getElementById('backdrop').addEventListener('click',function(){app.classList.remove('m-open');});
document.getElementById('langBtn').addEventListener('click',function(){toast('المعاينة متاحة بالعربية فقط');});
document.getElementById('bellBtn').addEventListener('click',function(){stopAuto();go('inbox');});

/* ================= Parent API & autoplay ================= */
window.addEventListener('message',function(e){
  var d=e.data;if(!d||d.type!=='pw:screen')return;
  if(RENDER[d.id]){stopAuto();go(d.id);}
});
var autoTimer=null,autoIdx=0,autoCycle=0;
var AUTO=['ops','papers','paper','inbox','messages'];
function stopAuto(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
function autoStep(){
  var id=AUTO[autoIdx%AUTO.length];autoIdx++;
  if(id==='paper'){S.paperId='p1';var p=P('p1');if(p.stage>=3){p.stage=1;p.s='under_review';HIST={};}S.openAcc={reports:true};}
  if(id==='papers'&&S.papersFilter!=='all'){S.papersFilter='all';}
  if(id==='ops'){S.opsTab='analytics';S.opsFilter='all';}
  if(id==='messages')S.openThread=null;
  var titleEl=null;
  if(id==='paper'&&S.screen==='papers'){var row=view.querySelector('[data-paper="p1"]');titleEl=row&&row.querySelector('[data-tid="p1"]');}
  go(id,{force:true,morphEl:titleEl});
  var later=function(fn,ms){setTimeout(function(){if(autoTimer&&S.screen===id)fn();},ms);};
  if(id==='ops'&&autoCycle%2===1)later(function(){setOpsTab('kanban');},1900);
  if(id==='papers')later(function(){setPapersFilter('under_review');},1500);
  if(id==='paper')later(function(){statusDialog();setTimeout(function(){if(autoTimer&&dlgState)applyStatus();},900);},1100);
  if(id==='messages')later(function(){toggleThread('t1');},1100);
  if(id==='messages')autoCycle++;
  autoTimer=setTimeout(autoStep,3500);
}

/* ================= Boot ================= */
renderSidebar();
if(THUMB)document.body.classList.add('thumb');
var start=Q.get('screen');if(!RENDER[start])start='ops';
paint(start);
try{if(window.parent!==window)window.parent.postMessage({type:'pw:ready',slug:'jms',screens:SCREENS},'*');}catch(e){}
notify(start);
if(THUMB){autoIdx=Math.max(0,AUTO.indexOf(start))+1;var first=AUTO[autoIdx-1];autoTimer=setTimeout(autoStep,3500);if(first==='papers')setTimeout(function(){if(autoTimer)setPapersFilter('under_review');},1500);}
window.__jms={go:go,screens:SCREENS};
})();
</script>
