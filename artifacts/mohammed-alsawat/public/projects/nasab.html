<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة نسب السوطة — معاينة</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f4efe4;--card:#fffdf7;--soft:#f8f4ea;--line:#d9d1bf;--line-strong:#c9c1b1;--fg:#1a1b1d;--muted:#6f6a5f;
  --accent:#9c7c33;--accent-ink:#7a5f1f;--on-accent:#faf7f0;--ink:#23201b;--on-ink:#faf7f0;--alive:#4f7f4a;
  --node:#fffdf7;--ink2:#4a463e;--track:#e5dfd0;--death:#9d4f3d;--wed:#9c7c33;--wed-bg:#faf3e1;--wed-line:#e3d3a8;
  --birth:#4f7f4a;--birth-ink:#3f6a3b;--birth-bg:#eef3ea;--birth-line:#cfdcc8;
  --a15:rgba(156,124,51,.15);--a10:rgba(156,124,51,.10);--a40:rgba(156,124,51,.40);
  --font:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--fg);background:#e9e2d2;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit}
h1,h2,h3,p{margin:0}
#phone{position:relative;flex:none;width:390px;height:800px;background:var(--bg);border-radius:46px;overflow:hidden;
  box-shadow:0 0 0 10px #1d1b17,0 0 0 11px #3a362e,0 40px 80px -20px rgba(35,32,27,.45);isolation:isolate;transform:scale(var(--s,1));transform-origin:center}
@media (max-width:520px){
  body{background:var(--bg)}
  #phone{width:100vw;height:100vh;border-radius:0;box-shadow:none;transform:none}
}
#app{position:absolute;inset:0;view-transition-name:screen}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.enter-fwd{animation:inF .42s var(--ease) both}.enter-back{animation:inB .42s var(--ease) both}
@keyframes inF{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
::view-transition-group(*){animation-duration:.46s;animation-timing-function:var(--ease)}
::view-transition-old(screen){animation:vtOutF .3s ease both}
::view-transition-new(screen){animation:vtInF .44s var(--ease) both}
html[data-dir=back]::view-transition-old(screen){animation-name:vtOutB}
html[data-dir=back]::view-transition-new(screen){animation-name:vtInB}
@keyframes vtOutF{to{opacity:0;transform:translateX(36px)}}
@keyframes vtInF{from{opacity:0;transform:translateX(-36px)}}
@keyframes vtOutB{to{opacity:0;transform:translateX(-36px)}}
@keyframes vtInB{from{opacity:0;transform:translateX(36px)}}
::view-transition-old(hero),::view-transition-new(hero){animation-duration:.46s;height:100%;object-fit:contain}
.disp{font-weight:800;letter-spacing:0}
.muted{color:var(--muted)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--accent-ink)}
.btn-ink{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-size:16px;font-weight:700;transition:transform .2s}
.btn-ink:active,.press:active{transform:scale(.985)}
.btn-line{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;border:1px solid var(--line);font-size:15px;color:var(--fg);transition:background .2s}
.btn-line:hover{background:var(--card)}
.backlink{display:inline-flex;align-items:center;gap:6px;height:40px;font-size:14px;color:var(--muted);align-self:flex-start;margin-right:-4px}
.backlink:hover{color:var(--fg)}
.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;height:100%;padding-top:14px}
.home-top{display:flex;height:44px;align-items:center;justify-content:space-between;padding:0 22px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.brand svg{width:30px;height:30px}
.gear{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-left:-12px}
.gear .ico{width:20px;height:20px;stroke-width:1.7}
.greet{padding:14px 22px 0;display:flex;flex-direction:column;gap:4px}
.greet h1{font-size:30px;line-height:1.2;font-weight:800}
.pulse{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.dot-alive{width:6px;height:6px;border-radius:50%;background:var(--alive);flex:none}
.cards{margin-top:16px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 22px;padding:4px 22px 8px;flex:1;min-height:0;max-height:680px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.cards>.slot{flex:none;width:calc(100% - 56px);max-width:440px;height:100%;scroll-snap-align:start;display:flex}
.hcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;width:100%;height:100%;overflow:hidden;border-radius:24px;padding:26px 24px 22px;text-align:right}
.hcard.plain{border:1px solid var(--line);background:var(--card)}
.hcard.hero{background:#23201b;color:#faf7f0}
.hcard.hero .kicker{color:#c6a863}
.hcard .wm{position:absolute;bottom:40px;left:-40px;width:210px;height:210px;opacity:.09;color:#efe7d8;pointer-events:none}
.hcard h2{font-weight:800}
.flex1{flex:1}
.hero-btn{position:relative;height:54px;width:100%;border-radius:14px;background:#c6a863;color:#14161a;font-size:16px;font-weight:700;text-align:center;transition:transform .2s}
.cardfoot{display:flex;width:100%;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:14px;font-weight:700;color:var(--accent-ink)}
.cardfoot .ico{width:17px;height:17px}
.relrow{display:flex;width:100%;flex:1;align-items:center}
.relrow .pill{flex:none;border-radius:999px;padding:8px 14px;font-size:14px}
.relrow .dash{flex:1;height:0;border-top:1.5px dashed var(--line-strong)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-top:1px solid var(--line)}
.statgrid>span{display:flex;flex-direction:column;gap:4px;padding:14px 12px 12px}
.statgrid>span:first-child{padding-right:0}
.statgrid>span.div{border-left:1px solid var(--line)}
.statgrid b{font-size:26px;line-height:1;font-weight:800}
.statgrid small{font-size:12px;color:var(--muted)}
.ncard{border:1px solid var(--line);border-top:3px solid var(--death);background:var(--card);padding:24px 18px 20px}
.nsmall{display:flex;min-height:56px;width:100%;align-items:center;gap:10px;border-radius:14px;padding:8px 12px;text-align:right}
.nsmall.wed{border:1px solid var(--wed-line);border-top:2px solid var(--wed);background:var(--wed-bg)}
.nsmall.birth{border:1px solid var(--birth-line);border-top:2px solid var(--birth);background:var(--birth-bg)}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 12px}
.dots button{height:6px;width:6px;border-radius:999px;background:var(--line-strong);transition:width .4s var(--ease),background-color .4s var(--ease)}
.dots button.on{width:22px;background:var(--accent)}
.home-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 22px 22px}
.home-foot .btn-ink svg.mk{width:22px;height:22px}

/* ---------- search ---------- */
.pad{padding:26px 22px 16px;display:flex;flex-direction:column;height:100%}
.title{font-size:26px;line-height:1.25;font-weight:800;margin-top:12px}
.sub{margin-top:6px;font-size:13.5px;line-height:1.8;color:var(--muted)}
.field{margin-top:16px;display:flex;height:56px;align-items:center;gap:10px;border-radius:14px;border:1px solid var(--line-strong);background:var(--card);padding:0 16px;transition:border-color .2s}
.field:focus-within{border-color:var(--accent)}
.field .ico{width:18px;height:18px;color:var(--muted)}
.field input{width:100%;border:0;background:transparent;outline:none;font-size:17px;font-weight:500;color:var(--fg)}
.field input::placeholder{font-size:15px;font-weight:400;color:var(--muted)}
.clear{width:26px;height:26px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.clear .ico{width:13px;height:13px;stroke-width:2.6}
.results{margin-top:16px;display:flex;flex-direction:column;min-height:0;flex:1}
.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:13px 15px;text-align:right;transition:border-color .25s,transform .25s}
.row:hover{border-color:var(--accent)}.row:active{transform:scale(.985)}
.row .ico{color:var(--muted)}
.nasab{display:block;font-size:14.5px;line-height:1.7;color:var(--muted)}
.nasab b{color:var(--fg);font-weight:700}
.rowmeta{margin-top:4px;display:block;font-size:12px;color:var(--muted)}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:7px}
.chip{border-radius:999px;padding:9px 15px;font-size:13.5px;border:1px solid var(--line);transition:background .2s,color .2s}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;padding-bottom:8px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.foot{margin-top:10px;font-size:12.5px;color:var(--muted);text-align:center}
.link{color:var(--fg);text-decoration:underline;text-decoration-color:rgba(156,124,51,.45);text-underline-offset:4px}
.rowin{animation:rowIn .35s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}
.lead{border-right:2px solid var(--accent);padding-right:14px}

/* ---------- tree ---------- */
.thead{position:relative;z-index:20;display:flex;height:56px;flex:none;align-items:center;justify-content:space-between;padding:0 18px}
.thead .grp{display:flex;align-items:center;gap:4px;min-width:0}
.ibtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.ibtn:hover{background:var(--card);color:var(--fg)}
.prevp{display:flex;min-height:44px;align-items:center;gap:2px;border-radius:999px;padding:0 4px 0 8px;color:var(--muted)}
.prevp span{font-size:13.5px;color:var(--fg);max-width:90px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prevp:hover{background:var(--card)}
.tmain{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:hidden;touch-action:none}
.zl{position:absolute;inset:0;transform-origin:50% 40%;transition:transform .45s var(--ease)}
.zl.drag{transition:none}
.zl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ns-node{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;text-align:center;line-height:1.15;border-radius:999px;will-change:transform}
.ns-node::before{content:"";position:absolute;inset:calc(var(--hp,0px)*-1);border-radius:14px}
.ns-node:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.ns-node .bd{font-size:10px;font-weight:400;opacity:.6}
.ns-node .hd{font-size:10px;font-weight:700;color:var(--accent-ink)}
.ns-node .me{font-size:10px;font-weight:400;opacity:.7}
.ns-dot{display:block;width:3px;height:3px;border-radius:50%;background:currentColor;flex:none;animation:nsPulse 3.6s ease-in-out infinite}
@keyframes nsPulse{0%,100%{opacity:.18}50%{opacity:.55}}
.climb{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;height:40px;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,253,247,.92);padding:0 16px;font-size:13px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06);white-space:nowrap}
.climb .ico{color:var(--accent)}
.zoomc{position:absolute;left:12px;z-index:20;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:rgba(255,253,247,.95);box-shadow:0 10px 24px -8px rgba(0,0,0,.18)}
.zoomc button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.zoomc button:disabled{opacity:.35;cursor:not-allowed}
.zoomc hr{margin:0;border:0;height:1px;background:var(--line)}
.zreset{position:absolute;left:50%;transform:translateX(-50%);z-index:20;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:12.5px;color:var(--fg);display:none;box-shadow:0 6px 16px -8px rgba(0,0,0,.2)}
.zreset.on{display:block;animation:rowIn .3s var(--ease)}
.sheet{position:absolute;left:0;right:0;z-index:30;display:flex;flex-direction:column;border-radius:24px 24px 0 0;border-top:1px solid var(--line);background:var(--card);padding:12px 18px 0;box-shadow:0 -12px 40px -20px rgba(0,0,0,.35);transition:top .38s var(--ease);touch-action:none;user-select:none}
.sheet.spring{transition:top .48s cubic-bezier(.2,.9,.25,1.12)}
.sheet.drag{transition:none}
.handle{margin:0 auto 8px;display:flex;height:24px;width:100%;flex:none;align-items:center;justify-content:center}
.handle span{height:4px;width:40px;border-radius:999px;background:var(--line);transition:background .2s}
.sheet .sc{margin:0 -18px;padding:0 18px 20px;min-height:0;flex:1;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.sheet .sc::-webkit-scrollbar{display:none}
.idrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pname{font-size:28px;line-height:1.1;font-weight:800}
.badge-me{border-radius:999px;background:var(--a15);color:var(--accent-ink);padding:4px 10px;font-size:12px}
.badge-alive{display:flex;align-items:center;gap:6px;border-radius:999px;background:var(--soft);padding:4px 10px;font-size:12px;color:var(--muted)}
.more{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.gorow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;border:1px solid var(--line);padding:0 14px;text-align:right}
.gorow .ico{width:17px;height:17px;color:var(--accent)}
.kin{margin-top:14px;border-right:2px solid var(--accent);padding-right:14px}
.stat4{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat4>div{border-radius:12px;border:1px solid var(--line);padding:9px 4px;text-align:center}
.stat4 b{display:block;font-size:19px;font-weight:700}
.stat4 small{display:block;margin-top:1px;font-size:11px;color:var(--muted)}
.tabs{position:sticky;top:0;z-index:2;background:var(--card);margin:0 -18px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding:4px 18px 8px}
.tab{height:40px;border-radius:999px;padding:0 14px;font-size:13px;border:1px solid var(--line);color:var(--muted)}
.tab.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.prow{display:flex;min-height:56px;width:100%;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 2px;text-align:right}
.ov{position:absolute;inset:0;z-index:50}
.chain{background:var(--bg);display:flex;flex-direction:column;padding:64px 26px 26px}
.chain-item{display:flex;align-items:baseline;gap:10px;padding:7px 0;transition:opacity .7s ease,transform .7s var(--ease)}
.scrim{background:rgba(8,9,11,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:24px 20px}
.dlg{width:100%;max-width:318px;max-height:calc(100% - 16px);overflow-y:auto;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);scrollbar-width:none}
.dlg::-webkit-scrollbar{display:none}
.xbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.preview{display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;border:1px solid rgba(217,209,191,.7);background:var(--bg);min-height:144px}
.preview img{display:block;width:100%;max-height:42vh;object-fit:contain;transition:opacity .25s}
.flabel{margin-bottom:6px;font-size:10.5px;color:var(--muted)}
.frow{display:flex;gap:6px}
.cchip{min-height:44px;flex:1;border-radius:999px;border:1px solid var(--line);padding:4px 2px;text-align:center;font-size:11px;color:var(--muted);transition:all .2s}
.cchip.on{border-color:rgba(156,124,51,.7);background:var(--a15);font-weight:700;color:var(--accent)}
.abtn{display:flex;height:44px;width:100%;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-size:14px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.abtn2{display:flex;height:44px;flex:1;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.abtn2 .ico,.abtn .ico{width:14px;height:14px}
.bsheet-wrap{background:rgba(20,18,14,.38);display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .25s ease}
.bsheet{background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px 24px;animation:up .38s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}}
.mrow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 2px;text-align:right}
.mrow:last-child{border-bottom:0}

/* ---------- relation ---------- */
.inp{margin-top:4px;height:50px;width:100%;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:16px;font-weight:500;color:var(--fg);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.pick{width:100%;border-radius:12px;border:1px solid rgba(217,209,191,.7);background:rgba(248,244,234,.5);padding:8px 12px;text-align:right;transition:border-color .2s}
.pick:hover{border-color:var(--accent)}
.box{border-radius:16px;border:1px solid var(--line);background:var(--card);padding:16px}
.mebox{border-radius:14px;border:1px solid var(--a40);background:rgba(156,124,51,.07);padding:12px 16px}
.pathcol{min-width:0;flex:1}
.pp{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:10px;padding:6px 10px;text-align:center;font-size:12.5px;border:1px solid rgba(217,209,191,.6);background:rgba(248,244,234,.5);color:var(--muted)}
.pp.last{border-color:var(--line);background:var(--soft);font-weight:700;color:var(--fg)}
.reveal{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .55s var(--ease)}
.reveal.in{opacity:1;transform:none}
.pathsvg{position:absolute;inset:0;pointer-events:none;overflow:visible}

/* ---------- news ---------- */
.shead{display:flex;height:56px;flex:none;align-items:center;gap:6px;padding:0 18px}
.shead .ico{width:20px;height:20px;stroke-width:1.8}
.dcard{border-radius:16px;border:1px solid var(--line);border-top:2px solid var(--death);background:var(--card);padding:16px 16px 14px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.maplink{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--accent-ink);text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
.maplink .ico{width:13px;height:13px;stroke-width:1.8}
.wcard{margin-top:10px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:13px 15px;transition:border-color .25s}
.wcard:hover{border-color:var(--accent)}

/* toast */
#toast{position:absolute;left:50%;bottom:28px;z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:12px 16px;font-size:13px;box-shadow:0 12px 30px -10px rgba(0,0,0,.3);transition:opacity .25s,transform .35s var(--ease);white-space:nowrap;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

const SURNAMES = ["السواط","الصواط","السويط","الصويط"];
const NOW_H = 1448;
const AD = "٠١٢٣٤٥٦٧٨٩";
const ar = (v) => String(v).replace(/\d/g, (d) => AD[+d]);
const nodes = [], byId = new Map(), kidsOf = new Map();
(function parse() {
  const stack = [];
  let id = 1;
  RAW.split("\n").filter((l) => l.trim()).forEach((line) => {
    const depth = line.match(/^ */)[0].length;
    const [nm, b, d] = line.trim().split(":");
    const dead = nm.endsWith("*");
    const n = { id: id++, first_name: dead ? nm.slice(0, -1) : nm, is_alive: !dead, birth_year: b ? +b : null, death_year: d ? +d : null,
      father_id: depth ? stack[depth - 1].id : null, generation: depth + 1 };
    stack[depth] = n; stack.length = depth + 1;
    nodes.push(n); byId.set(n.id, n); kidsOf.set(n.id, []);
    if (n.father_id) kidsOf.get(n.father_id).push(n);
  });
  const desc = (n) => kidsOf.get(n.id).reduce((t, k) => t + 1 + desc(k), 0);
  nodes.forEach((n) => {
    n.children_count = kidsOf.get(n.id).length;
    n.descendants_count = desc(n);
    const ch = []; let c = n; while (c) { ch.push(c.first_name); c = c.father_id ? byId.get(c.father_id) : null; }
    n.chainNames = ch;
    n.full_nasab = ch.join(" بن ");
    n.father_name = ch[1] || null;
  });
})();
const kids = (id) => kidsOf.get(id) || [];
const father = (n) => (n && n.father_id ? byId.get(n.father_id) : null);
const ROOT = nodes[0];
const find = (name, fatherName) => nodes.find((n) => n.first_name === name && n.father_name === fatherName);

/* ================= نصوص ================= */
function plural(c, f) { if (c === 1) return f.one; if (c === 2) return f.two; return c <= 10 ? `${ar(c)} ${f.few}` : `${ar(c)} ${f.many}`; }
const sonsPhrase = (c) => plural(c, { one: "ابن", two: "ابنان", few: "أبناء", many: "ابناً" });
const resultsPhrase = (c) => plural(c, { one: "نتيجة", two: "نتيجتان", few: "نتائج", many: "نتيجة" });
const yearsPhrase = (c) => plural(c, { one: "سنة", two: "سنتان", few: "سنوات", many: "سنة" });
function counted(n, f) { if (n === 1) return f.one; if (n === 2) return f.two; return n >= 3 && n <= 10 ? f.few : f.many; }
const ORD = ["", "الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر"];
const ORDF = ["", "الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة"];
const genPhrase = (g) => `الجيل ${ORD[g] || ar(g)}`;
const withSurname = (s, sn) => `${s} ${sn || state.surname}`;
function birthLine(p) {
  if (!p.birth_year) return null;
  const age = p.is_alive ? `العمر ${yearsPhrase(NOW_H - p.birth_year)}` : p.death_year ? `عاش ${yearsPhrase(p.death_year - p.birth_year)}` : null;
  const born = `مواليد ${ar(p.birth_year)}هـ`;
  return age ? `${age} · ${born}` : born;
}
const norm = (s) => s.replace(/[\u064B-\u0652\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").trim();

/* ================= القرابة (منقولة من lib/kinship) ================= */
const MINE_UP = ["", "أبوك", "جدّك", "جدّ أبيك", "جدّ جدّك"];
const OF_MINE_UP = ["", "أبيك", "جدّك", "جدّ أبيك", "جدّ جدّك"];
const MINE_DOWN = ["", "ابنك", "حفيدك", "ابن حفيدك", "حفيد حفيدك"];
const BELOW = ["", "ابن", "حفيد", "ابن حفيد", "حفيد حفيد"];
const YOU_AT = ["أنت", "أبوك", "جدّك", "جدّ أبيك", "جدّ جدّك"];
const HIM_AT = ["هو", "أبوه", "جدّه", "جدّ أبيه", "جدّ جدّه"];
const genLabel = (n) => (n === 1 ? "جيل واحد" : n === 2 ? "جيلين" : `${ar(n)} أجيال`);
const ofMineUp = (n) => OF_MINE_UP[n] || `الجدّ الذي يبعد عنك ${genLabel(n)}`;
const below = (n, w) => (BELOW[n] ? `${BELOW[n]} ${w}` : `من ذرّية ${w}`);
function describe(a, b, anc) {
  if (a === 0 && b === 0) return { label: "الشخص نفسه", detail: "اخترت الشخص نفسه في الخانتين." };
  if (b === 0) return { label: MINE_UP[a] || "جدّك الأعلى", detail: a === 1 ? "هو والدك مباشرةً." : `هو في خطّ آبائك المباشر، على بُعد ${genLabel(a)} فوقك.` };
  if (a === 0) return { label: MINE_DOWN[b] || "من ذرّيتك البعيدة", detail: b === 1 ? "هو ابنك مباشرةً." : `هو في خطّ ذرّيتك المباشر، على بُعد ${genLabel(b)} تحتك.` };
  const y = YOU_AT[a - 1], h = HIM_AT[b - 1];
  const detail = a === 1 && b === 1 ? "أبوكما واحد." : y && h ? `${y} و${h} أخوان.` : `فرعك وفرعه يفترقان عند ابنَي ${anc.first_name}.`;
  if (a === 1 && b === 1) return { label: "أخوك", detail };
  if (a === 1) return { label: below(b - 1, "أخيك"), detail };
  if (b === 1) return { label: a === 2 ? "عمّك" : `عمّ ${ofMineUp(a - 2)}`, detail };
  const deg = Math.min(a, b) - 1;
  const rank = deg === 1 ? "" : ` من الدرجة ${ORDF[deg] || ar(deg)}`;
  if (a === b) return { label: `ابن عمّك${rank}`, detail };
  if (a > b) return { label: `ابن عمّ ${ofMineUp(a - b)}${rank}`, detail };
  return { label: `${below(b - a, "ابن عمّك")}${rank}`, detail };
}
function chainUp(id) { const out = []; let c = byId.get(id); while (c) { out.push(c); c = father(c); } return out; }
function kinship(aId, bId) {
  const A = chainUp(aId), B = chainUp(bId);
  const bi = new Map(B.map((n, i) => [n.id, i]));
  for (let i = 0; i < A.length; i++) if (bi.has(A[i].id)) {
    const j = bi.get(A[i].id);
    return { a: i, b: j, ancestor: A[i], pathA: A.slice(0, i + 1), pathB: B.slice(0, j + 1), ...describe(i, j, A[i]) };
  }
  return null;
}

/* ================= البحث ================= */
function searchNodes(q, limit = 30) {
  const toks = norm(q).split(/\s+/).filter((t) => t && t !== "بن" && t !== "ابن");
  if (!toks.length) return [];
  const out = nodes.filter((n) => toks.every((t, i) => {
    const nm = n.chainNames[i]; if (!nm) return false;
    const x = norm(nm);
    return i < toks.length - 1 ? x === t : x.startsWith(t);
  }));
  out.sort((p, q2) => p.generation - q2.generation || p.id - q2.id);
  return out.slice(0, limit);
}

    <div class="box" style="position:relative"><div class="reveal" data-rv="0" style="margin:0 auto 4px;width:fit-content;border-radius:10px;border:1px solid rgba(156,124,51,.6);background:var(--a10);padding:6px 16px;text-align:center;font-size:13px;font-weight:700">${k.ancestor.first_name}</div>
      <p class="muted reveal" data-rv="0" style="margin-bottom:12px;text-align:center;font-size:10.5px">الجدّ المشترك · الجيل ${ar(k.ancestor.generation)}</p>
      <div style="display:flex;gap:12px">${col(k.pathA, "فرعك", k.a)}${col(k.pathB, "فرعه", k.b)}</div></div>
    <div class="reveal" data-rv="6" style="display:flex;gap:8px"><button class="abtn press" style="height:50px;flex:1" data-act="openAnc" data-id="${k.ancestor.id}">افتح الجدّ المشترك في الشجرة</button>
      <button class="abtn2" style="height:50px;width:56px;flex:none" data-act="shareRel" aria-label="مشاركة النتيجة">${I("share", "", "width:18px;height:18px")}</button></div></div>`;
  const els = out.querySelectorAll(".reveal");
  if (!animate || reduced) { els.forEach((e) => e.classList.add("in")); return; }
  els.forEach((e) => setTimeout(() => e.classList.add("in"), 60 + (+e.dataset.rv) * 170));
}

/* ================= أخبار العائلة ================= */

/* ================= التنقّل ================= */
const sectionOf = (id) => (id === "card" ? "tree" : id);
function applyScreen(id, opts) {
  const prev = state.screen;
  state.screen = id;
  const s = sectionOf(id);
  document.querySelectorAll(".screen").forEach((el) => el.classList.toggle("on", el.id === "s-" + s));
  if (s === "home") renderHome();
  if (s === "search") renderSearch();
  if (s === "relation") renderRelation();
  if (s === "news") renderNews();
  if (s === "tree") {
    const fresh = sectionOf(prev) !== "tree" || opts.refocus;
    if (opts.focusId != null) { state.focusId = opts.focusId; state.trailId = opts.trailId ?? null; state.visited = opts.keepVisited ? state.visited : []; state.step = 1; state.zoom = 1; state.panX = 0; state.panY = 0; }
    if (fresh) { renderHeader(); renderTree(true); renderSheet(); }
    if (id === "card") openCard();
    else { const ov = $("#tov"); if (ov.firstChild) ov.innerHTML = ""; }
  }
  post({ type: "pw:screen-changed", slug: "nasab", id });
  if (THUMB) scheduleThumb(id);
}
function go(id, opts = {}) {
  if (!ORDER.includes(id)) id = "home";
  if (id === state.screen && opts.focusId == null) return;
  const prev = state.screen;
  clearTimers();
  const dir = opts.dir || (ORDER.indexOf(id) >= ORDER.indexOf(prev) ? "fwd" : "back");
  const sameSection = prev && sectionOf(prev) === sectionOf(id) && opts.focusId == null;
  if (!prev || reduced) { applyScreen(id, opts); return; }
  if (document.startViewTransition) {
    document.documentElement.dataset.dir = dir;
    const from = opts.heroFrom && opts.heroFrom();
    if (from) from.style.viewTransitionName = "hero";
    if (sameSection) $("#app").style.viewTransitionName = "none";
    let to = null;
    const t = document.startViewTransition(() => {
      if (from) from.style.viewTransitionName = "";
      applyScreen(id, opts);
      to = opts.heroTo && opts.heroTo();
      if (to && from) to.style.viewTransitionName = "hero";
    });
    const done = () => { if (to) to.style.viewTransitionName = ""; if (from) from.style.viewTransitionName = ""; $("#app").style.viewTransitionName = ""; };
    t.finished.then(done, done);
  } else {
    applyScreen(id, opts);
    const el = sameSection ? $("#tov").firstElementChild : sec(sectionOf(id));
    if (el) { el.classList.remove("enter-fwd", "enter-back"); void el.offsetWidth; el.classList.add(dir === "back" ? "enter-back" : "enter-fwd"); }
  }
}
const focusEl = () => tv.els.get(state.focusId);

/* ================= الأحداث ================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-pick],[data-chip],[data-tab],[data-open],[data-style],[data-sn],[data-relpick],.ns-node");
  if (!t) return;
  if (t.classList.contains("ns-node")) {
    if (dragMoved) return;
    const id = +t.dataset.id;
    if (id === state.focusId) setStep(state.step >= 3 ? 3 : state.step + 1, true); else recenter(id);
    return;
  }
  if (t.dataset.pick) { const id = +t.dataset.pick; go("tree", { focusId: id, trailId: id, heroFrom: () => t.querySelector("[data-hero]"), heroTo: focusEl }); return; }
  if (t.dataset.chip !== undefined) { state.chip = t.dataset.chip || null; drawResults(); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; renderSheet(); return; }
  if (t.dataset.open) { recenter(+t.dataset.open); return; }
  if (t.dataset.style) { state.cardStyle = t.dataset.style; syncCardChips(); drawCard(); return; }
  if (t.dataset.sn) { state.surname = t.dataset.sn; syncCardChips(); drawCard(); return; }
  if (t.dataset.relpick) { state.relB = byId.get(+t.dataset.relpick); drawPickerB(); drawRelOut(true); setTimeout(() => { const b = $("#relBody"), o = $("#relOut"); if (b && o) b.scrollTo({ top: Math.max(0, o.offsetTop - b.offsetTop - 150), behavior: reduced ? "auto" : "smooth" }); }, 700); return; }
  const a = t.dataset.act;
  e.preventDefault();
  switch (a) {
    case "home": go("home", { dir: "back" }); break;
    case "search": state.q = ""; go("search", { dir: "back" }); break;
    case "browse": go("tree", { focusId: ROOT.id }); break;
    case "openMe": go("tree", { focusId: state.me.id }); break;
    case "relation": go("relation"); break;
    case "news": go("news"); break;
    case "stats": toast("أرقام وإحصائيات: محسوبةٌ من الشجرة نفسها"); break;
    case "gear": toast("الإعدادات: البلاغات والمظهر ومَن نحن"); break;
    case "fromRoot": go("tree", { focusId: ROOT.id }); break;
    case "addme": toast("يُرسَل طلب إضافتك للمشرفين قبل أن يمسّ الشجرة"); break;
    case "tback": { const prev = state.visited.pop(); if (prev != null) focusOn(prev); break; }
    case "toggleSheet": if (!sheetDragged) setStep(state.step === 3 ? 1 : state.step + 1, true); break;
    case "family": setStep(state.step === 3 ? 2 : 3, true); setTimeout(() => { const ft = $("#famTabs"), sc = $("#sheetSc"); if (state.step === 3 && ft && sc) sc.scrollTo({ top: ft.offsetTop - 8, behavior: reduced ? "auto" : "smooth" }); }, 60); break;
    case "chain": openChain(); break;
    case "report": openReport(); break;
    case "sendReport": $("#tov").innerHTML = ""; toast("يراجعه المشرفون قبل أن يمسّ الشجرة"); break;
    case "addKid": openReport(); break;
    case "closeOv": $("#tov").innerHTML = ""; break;
    case "closeOvBg": if (e.target === t) $("#tov").innerHTML = ""; break;
    case "closeCardBg": if (e.target === t) go("tree", { dir: "back" }); break;
    case "card": go("card", { heroFrom: () => $("#pname"), heroTo: () => $("#cardPrev") }); break;
    case "closeCard": go("tree", { dir: "back", heroFrom: () => $("#cardPrev"), heroTo: () => $("#pname") }); break;
    case "shareCard": toast("نُسخ النسب مع الرابط"); break;
    case "saveCard": toast("بدأ تنزيل الصورة."); break;
    case "copyNasab": toast("تم نسخ النسب الكامل."); break;
    case "relFromSheet": state.relB = byId.get(state.focusId); go("relation"); setTimeout(() => drawRelOut(true), 0); break;
    case "clearB": state.relB = null; drawPickerB(); drawRelOut(false); setTimeout(() => { const i = $("#relInp"); if (i) i.focus(); }, 0); break;
    case "openAnc": go("tree", { focusId: +t.dataset.id, trailId: state.relB ? state.relB.id : null, dir: "fwd" }); break;
    case "shareRel": toast("نُسخت النتيجة مع الرابط"); break;
    case "openTreeAt": go("tree", { focusId: +t.dataset.id, dir: "fwd" }); break;
    case "map": toast("يفتح الموقع في خرائط قوقل"); break;
    case "contribute": go("tree", { focusId: state.me.id }); break;
    case "archive": toast("الأرشيف: الأخبار بعد انقضاء مدّتها"); break;
    case "sendNews": toast("أرسِل خبراً: وفاة أو زواج أو مولود — يُراجَع ثمّ يُنشر"); break;
  }
});
// الضغط على فراغ الشجرة يطوي البطاقة
$("#tmain").addEventListener("click", (e) => { if (e.target.closest(".ns-node,.climb,.zoomc,.zreset")) return; if (!dragMoved && state.step > 1) setStep(1); });
// سحب الشجرة حين تُكبَّر
let dragMoved = false, sheetDragged = false;
(() => {
  const host = $("#tmain"); let st = null;
  host.addEventListener("pointerdown", (e) => { if (e.target.closest(".zoomc,.zreset,.climb")) return; dragMoved = false; st = { x: e.clientX, y: e.clientY, px: state.panX, py: state.panY }; });
  host.addEventListener("pointermove", (e) => { if (!st) return; const dx = (e.clientX - st.x) / SCALE, dy = (e.clientY - st.y) / SCALE; if (!dragMoved && Math.hypot(dx, dy) < 6) return; if (state.zoom <= 1) return; dragMoved = true; $("#zl").classList.add("drag"); state.panX = st.px + dx; state.panY = st.py + dy; applyZoom(); });
  const end = () => { st = null; $("#zl").classList.remove("drag"); setTimeout(() => (dragMoved = false), 0); };
  host.addEventListener("pointerup", end); host.addEventListener("pointercancel", end); host.addEventListener("pointerleave", end);
  host.addEventListener("wheel", (e) => { e.preventDefault(); setZoom(state.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)); }, { passive: false });
})();
// سحب البطاقة بين درجاتها
(() => {
  const sh = $("#sheet"); let d = null;
  sh.addEventListener("pointerdown", (e) => { if (!e.target.closest(".handle,.idrow")) return; if (e.target.closest(".more")) return; sheetDragged = false; d = { y: e.clientY, top: sh.offsetTop }; });
  window.addEventListener("pointermove", (e) => { if (!d) return; const dy = (e.clientY - d.y) / SCALE; if (!sheetDragged && Math.abs(dy) < 6) return; sheetDragged = true; sh.classList.add("drag"); sh.style.top = Math.max(sheetTop(3), Math.min(sheetTop(1) + 40, d.top + dy)) + "px"; });
  window.addEventListener("pointerup", () => {
    if (!d) return; sh.classList.remove("drag");
    if (sheetDragged) { const y = sh.offsetTop; let best = 1, bd = 1e9; [1, 2, 3].forEach((s) => { const dd = Math.abs(sheetTop(s) - y); if (dd < bd) { bd = dd; best = s; } }); setStep(best, true); }
    d = null; setTimeout(() => (sheetDragged = false), 0);
  });
})();
window.addEventListener("resize", () => { fitPhone(); if (sectionOf(state.screen) === "tree") { renderTree(true); placeSheet(false); } });
window.addEventListener("message", (e) => { const m = e.data; if (m && m.type === "pw:screen" && typeof m.id === "string") go(m.id); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#tov").firstChild) { if (state.screen === "card") go("tree", { dir: "back" }); else $("#tov").innerHTML = ""; } });

/* ================= وضع العرض المصغّر ================= */
function typeInto(inp, text, every, done) {
  let i = 0; inp.value = "";
  const tick = () => { i++; inp.value = text.slice(0, i); inp.dispatchEvent(new Event("input")); if (i < text.length) later(tick, every); else if (done) done(); };
  later(tick, every);
}
const NEXT = { home: "search", search: "tree", tree: "relation", relation: "card", card: "news", news: "home" };
function scheduleThumb(id) {
  clearTimers();
  let dur = 3500;
  if (id === "home") { later(() => homeGo(1), 1300); later(() => homeGo(2), 2500); dur = 3600; }
  if (id === "search") {
    const inp = $("#sInput");
    later(() => typeInto(inp, "سالم ناصر", 100, () => later(() => { const r = $("[data-pick]"); if (r) r.click(); }, 1200)), 300);
    return; // اختيارُ النتيجة ينقل إلى الشجرة
  }
  if (id === "tree") {
    const f = byId.get(state.focusId);
    const son = kids(f.id).find((k) => kids(k.id).length) || kids(f.id)[0];
    if (son) { later(() => recenter(son.id), 1100); later(() => recenter(f.id), 2500); }
    dur = 3900;
  }
  if (id === "relation") {
    if (state.relB) { state.relB = null; drawPickerB(); drawRelOut(false); }
    later(() => { const inp = $("#relInp"); if (inp) typeInto(inp, "منصور", 120, () => later(() => { const b = $("[data-relpick]"); if (b) b.click(); }, 350)); }, 300);
    dur = 4600;
  }
  if (id === "card") { later(() => { state.cardStyle = "ladder"; syncCardChips(); drawCard(); }, 1300); later(() => { state.cardStyle = "light"; syncCardChips(); drawCard(); }, 2500); dur = 3800; }
  if (id === "news") { later(() => { const s = $("#newsSc"); if (s) s.scrollTo({ top: 220, behavior: "smooth" }); }, 1500); }
  later(() => go(NEXT[id]), dur);
}

/* ================= البدء ================= */
const startId = ORDER.includes(params.get("screen")) ? params.get("screen") : "home";
let started = false;
function start() {
  if (started) return; started = true;
  post({ type: "pw:ready", slug: "nasab", screens: SCREENS.map((s) => ({ id: s.id, label: s.label })) });
  applyScreen(startId, {});
}
// الخطّ يصل ثم تُقاس الأسماء؛ ولا يُنتظر أكثر من لحظة
const fontsReady = document.fonts && document.fonts.load ? Promise.race([Promise.all([document.fonts.load("700 16px Tajawal"), document.fonts.load("500 16px Tajawal"), document.fonts.load("800 16px Tajawal")]), new Promise((r) => setTimeout(r, 900))]) : Promise.resolve();
fontsReady.then(start, start);
let fontOk = 0;
const tajawalLoaded = () => { try { return [...document.fonts].filter((f) => f.family.replace(/["']/g, "") === "Tajawal" && f.status === "loaded").length; } catch (e) { return 0; } };
const refont = () => {
  const n = tajawalLoaded();
  if (!started || n <= fontOk) return;
  fontOk = n; mctx = null;
  if (sectionOf(state.screen) === "tree") renderTree(true);
  if (state.screen === "card") drawCard();
};
if (document.fonts) { if (document.fonts.ready) document.fonts.ready.then(refont); document.fonts.addEventListener("loadingdone", () => setTimeout(refont, 50)); }
})();
</script>
