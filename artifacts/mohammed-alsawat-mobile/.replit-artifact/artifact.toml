kind = "mobile"
previewPath = "/mobile/"
title = "Mohammed Alsawat — Mobile App"
version = "1.0.0"
id = "artifacts/mohammed-alsawat-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 25649

[services.development]
run = "pnpm --filter @workspace/mohammed-alsawat-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mohammed-alsawat-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mohammed-alsawat-mobile", "run", "serve" ]

[services.env]
PORT = "25649"
BASE_PATH = "/mobile/"
